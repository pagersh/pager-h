<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="HAMZACHAT">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3602/3602145.png">

    <link rel="manifest" href="manifest.json">

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <!-- Canvas Confetti CDN -->

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --neon-green: #10B981;
            --premium-orange: #FF3B00;
        }

        /* --- AYDINLIK PREMIUM GÜNDÜZ MODU TASARIMI --- */
        body {
            background: linear-gradient(135deg, #f5f3ef 0%, #e8e4dc 100%);
            color: #2c2b29;
            font-family: var(--font-sans);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 0.25rem;
            overflow: hidden;
            transition: background-color 0.4s ease, color 0.4s ease;
            position: relative;
        }

        body::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image: radial-gradient(rgba(140, 130, 115, 0.12) 1.5px, transparent 1.5px);
            background-size: 24px 24px;
            animation: livePhotoPulse 8s infinite alternate ease-in-out;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes livePhotoPulse {
            0% { transform: scale(1) translate(0, 0); opacity: 0.6; }
            50% { transform: scale(1.03) translate(-3px, 3px); opacity: 0.9; }
            100% { transform: scale(1) translate(3px, -3px); opacity: 0.6; }
        }

        .pager-card {
            background: rgba(255, 253, 249, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 12px 35px rgba(60, 50, 40, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.9);
            transition: all 0.3s ease;
            z-index: 10;
        }

        /* --- GECE MODU --- */
        body.dark-mode {
            background-color: #0c0d10;
            background-image: none;
            color: #F3F4F6;
        }

        body.dark-mode::before {
            background-image: radial-gradient(rgba(255, 59, 0, 0.12) 1.5px, transparent 1.5px);
        }

        body.dark-mode .pager-card {
            background-color: rgba(16, 18, 22, 0.92);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
            inset: unset;
        }

        /* --- PREMIUM TOGGLE SWITCH --- */
        .premium-switch {
            width: 58px;
            height: 30px;
            background: #e2ddd5;
            border-radius: 999px;
            position: relative;
            cursor: pointer;
            border: 1px solid rgba(0,0,0,0.1);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.15), 0 1px 2px rgba(255,255,255,0.8);
            padding: 3px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
        }

        .premium-switch .switch-knob {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #ffffff, #ded8cd);
            border: 1px solid rgba(0,0,0,0.08);
            position: absolute;
            left: 3px;
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.3s, box-shadow 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 3px 6px rgba(0,0,0,0.15);
        }

        .premium-switch .switch-knob::after {
            content: "";
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: radial-gradient(circle, #f0ece1 0%, #d4cec3 100%);
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.1);
        }

        body.dark-mode .premium-switch {
            background: linear-gradient(90deg, #ff3b00 0%, #e62e00 100%);
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.4), 0 0 12px rgba(255, 59, 0, 0.4);
            border-color: #ff3b00;
        }

        body.dark-mode .premium-switch .switch-knob {
            transform: translateX(28px);
            background: radial-gradient(circle at 30% 30%, #2c2d33, #0f1012);
            border: 1px solid rgba(255, 59, 0, 0.5);
            box-shadow: -2px 3px 8px rgba(0,0,0,0.7), 0 0 10px rgba(0,0,0,0.5);
        }

        body.dark-mode .premium-switch .switch-knob::after {
            background: radial-gradient(circle, #383a42 0%, #1a1b20 100%);
        }

        /* --- CİHAZ KARTI & MODALLAR --- */
        .device-box-71 {
            background-color: #faf8f5;
            border-radius: 32px;
            padding: 16px;
            width: 100%;
            max-width: 340px;
            margin: 0 auto;
            box-shadow: 0 20px 40px rgba(50, 40, 30, 0.12);
            border: 1px solid rgba(0,0,0,0.06);
            color: #2c2b29;
            transition: all 0.3s ease;
        }

        .device-screen-71 {
            background: linear-gradient(135deg, #ffffff 0%, #f2efe9 100%);
            border-radius: 20px;
            padding: 16px;
            border: 1px solid rgba(0,0,0,0.06);
            position: relative;
            overflow: hidden;
            margin-bottom: 12px;
            transition: all 0.3s ease;
        }

        .device-btn-71 {
            background-color: #e8e3d8;
            border-radius: 14px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #2c2b29;
            font-size: 14px;
            border: 1px solid rgba(0,0,0,0.04);
            transition: all 0.2s;
            cursor: pointer;
        }

        .device-btn-71:hover {
            background-color: #ded7cb;
            transform: translateY(-1px);
        }

        .device-btn-primary {
            background-color: #2c2b29;
            color: #ffffff !important;
            font-weight: 700;
            border: none;
        }
        .device-btn-primary span, .device-btn-primary i {
            color: #ffffff !important;
        }

        body.dark-mode .device-box-71 {
            background-color: #14161b;
            box-shadow: 0 20px 40px rgba(0,0,0,0.7);
            border: 1px solid rgba(255,255,255,0.08);
            color: #ffffff;
        }

        body.dark-mode .device-screen-71 {
            background: linear-gradient(135deg, #1c1f26 0%, #0e1014 100%);
            border: 1px solid rgba(255,255,255,0.08);
        }

        body.dark-mode .device-btn-71 {
            background-color: #21252e;
            color: #ffffff;
            border: 1px solid rgba(255,255,255,0.06);
        }

        body.dark-mode .device-btn-primary {
            background-color: #ff3b00;
            color: #ffffff;
            box-shadow: 0 0 12px rgba(255, 59, 0, 0.3);
        }

        .bottom-sheet {
            transform: translateY(100%);
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .bottom-sheet.show {
            transform: translateY(0);
        }

        .btn-6565 {
            border-radius: 999px;
            transition: all 0.2s ease;
        }
        .btn-6565:active {
            transform: scale(0.95);
        }

        .force-black { color: #2c2b29 !important; }
        body.dark-mode .dark-text-fix { color: #FFFFFF !important; }

        body.dark-mode .dark-input-fix {
            background-color: rgba(20, 24, 30, 0.95) !important;
            color: #FFFFFF !important;
            border-color: rgba(255, 59, 0, 0.3) !important;
        }

        input, textarea, button {
            -webkit-user-select: text !important;
            user-select: text !important;
        }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>

    <div class="w-full max-w-md h-[95vh] max-h-[720px] flex flex-col gap-1.5 relative overflow-hidden p-1.5 z-10">
        
        <!-- ÜST BİLGİ & KANALLAR ÇUBUĞU -->
        <div class="pager-card rounded-2xl px-3 py-2 flex flex-col gap-2 text-xs">
            <div class="flex justify-between items-center">

                    <div class="flex flex-col">

                        </div>

                </div>
                
                <div class="flex items-center gap-1.5">
                    <div id="theme-toggle-btn" onclick="toggleTheme()" class="premium-switch" title="Gece/Gündüz Modu">

                    </div>

                    <button id="notif-toggle-btn" onclick="toggleNotifications()" title="Bildirimleri Aç/Kapat" class="p-1.5 rounded-full bg-stone-100 hover:bg-stone-200 border border-stone-300/60 font-bold btn-6565 shadow-xs">
                        <i id="notif-icon" class="fa-solid fa-bell text-[11px] force-black"></i>
                    </button>
                    <button onclick="clearCurrentChannelMessages()" title="Temizle" class="p-1.5 rounded-full bg-stone-100 hover:bg-stone-200 border border-stone-300/60 font-bold btn-6565 shadow-xs">
                        <i class="fa-solid fa-trash text-[11px] force-black"></i>
                    </button>
                    <button onclick="openContactsBookModal()" title="Kişi Rehberi" class="px-2.5 py-1 rounded-full bg-stone-100 hover:bg-stone-200 font-bold border border-stone-300/60 text-[10px] flex items-center gap-1 btn-6565 shadow-xs">
                        <i class="fa-solid fa-address-book text-[10px] force-black"></i> <span class="force-black">Rehber</span>
                    </button>
                    <button id="add-contact-top-btn" onclick="openAddContactModal()" title="Kişi Ekle" class="px-2.5 py-1 rounded-full bg-[#2c2b29] hover:opacity-90 font-bold border border-stone-800 text-[10px] flex items-center gap-1 btn-6565 shadow-xs">
                        <i class="fa-solid fa-user-plus text-[10px] text-white"></i> <span class="text-white">Ekle</span>
                    </button>

            </div>

            <!-- HIZLI KANAL GEÇİŞİ -->
            <div class="flex items-center justify-between gap-1 bg-black/5 p-1 rounded-xl border border-stone-300/30 overflow-x-auto hide-scrollbar">
                <div class="flex items-center gap-1 overflow-x-auto hide-scrollbar" id="channel-tabs"></div>
            </div>
        </div>

        <!-- ANA PAGER EKRANI -->
        <div class="pager-card rounded-2xl p-3 flex-1 flex flex-col justify-between gap-2 overflow-hidden relative">
            
            <div class="flex justify-between items-center px-1 py-0.5 border-b border-stone-300/40 text-xs">
                <div class="flex items-center gap-1.5">
                    <i class="fa-solid fa-tower-broadcast text-emerald-600 dark:text-[#ff3b00]"></i>
                    <span id="active-chat-title" class="font-semibold dark-text-fix force-black">ALL KANALI</span>
                </div>
                <div class="flex items-center gap-1.5 font-mono text-[10px] text-stone-500">
                    <span class="dark-text-fix font-bold force-black">UÇTAN UCA ŞİFRELİ</span>

            </div>

            <!-- MESAJ AKIŞ ALANI -->
            <div id="chat-messages" class="flex-1 overflow-y-auto hide-scrollbar flex flex-col gap-2 pr-0.5 justify-end"></div>

            <!-- MESAJ GİRİŞ FORMU -->
            <div class="flex flex-col gap-1 pt-1.5 pb-1 border-t border-stone-300/40">
                <form id="chat-form" onsubmit="handleFormSubmit(event)" class="flex items-center gap-1.5">
                    <input type="file" id="file-input" accept="image/*" class="hidden" onchange="handleFileSelected(event)" />
                    
                    <button type="button" onclick="document.getElementById('file-input').click()" title="Resim Gönder" class="w-9 h-9 rounded-full bg-stone-200 hover:bg-stone-300 flex items-center justify-center transition flex-shrink-0 border border-stone-300 font-bold btn-6565 shadow-xs">

                    <!-- KONFETİ TETİKLEYİCİ BUTON -->
                    <button type="button" onclick="sendConfettiSignal()" title="Konfeti Patlat" class="w-9 h-9 rounded-full bg-amber-100 hover:bg-amber-200 flex items-center justify-center transition flex-shrink-0 border border-amber-300 font-bold btn-6565 shadow-xs">
                        <i class="fa-solid fa-cat text-xs force-black"></i>

                    <input type="text" id="chat-input" placeholder="Mesajınızı yazın..." autocomplete="off"

                    <button id="send-btn" type="submit" class="w-9 h-9 rounded-full bg-[#2c2b29] hover:opacity-90 font-bold flex items-center justify-center transition active:scale-95 flex-shrink-0 shadow-sm btn-6565">

    <!-- KİŞİ EKLEME MODALI -->
    <div id="contact-modal" class="fixed inset-0 bg-black/40 backdrop-blur-xs hidden items-center justify-center z-50 p-4 transition-opacity">
        <div id="contact-modal-content" class="device-box-71 bottom-sheet">

                    <i class="fa-solid fa-user-plus text-2xl text-stone-700 dark:text-[#ff3b00]"></i>
                </div>
                <div class="text-center">
                    <div class="text-xs font-bold tracking-wider dark-text-fix force-black">REHBERE YENİ EKLE</div>
                    <div class="text-[10px] text-emerald-600 dark:text-[#ff3b00] font-mono mt-0.5">HAMZACHAT NODE</div>
                </div>
            </div>

            <div class="flex flex-col gap-2.5 mb-4 px-1 text-xs">
                <input type="text" id="friend-name-input" placeholder="Kişi İsmi / Lakap" class="bg-white dark:bg-[#1a1d24] border border-stone-300 dark:border-white/10 rounded-xl py-2.5 px-3 dark:text-white focus:outline-none focus:border-stone-500 placeholder-stone-400 shadow-inner" />
                <input type="text" id="friend-id-input" placeholder="4 Haneli ID (Örn: A8F2)" maxlength="4" class="bg-white dark:bg-[#1a1d24] border border-stone-300 dark:border-white/10 rounded-xl py-2.5 px-3 font-mono uppercase text-emerald-600 dark:text-[#ff3b00] focus:outline-none focus:border-stone-500 placeholder-stone-400 shadow-inner" />

            <div class="grid grid-cols-3 gap-2 px-1">

                    <i class="fa-regular fa-copy"></i>
                </button>
                <button onclick="saveContact()" class="device-btn-71 device-btn-primary" title="Kaydet">

                </button>
            </div>
        </div>

    <!-- KİŞİ REHBERİ MODALI -->
    <div id="contacts-book-modal" class="fixed inset-0 bg-black/40 backdrop-blur-xs hidden items-center justify-center z-50 p-4 transition-opacity">
        <div id="contacts-book-content" class="device-box-71 bottom-sheet max-h-[85vh] flex flex-col">
            <div class="device-screen-71 flex flex-col py-4 px-3 gap-2.5">
                <div class="flex justify-between items-center">
                    <span class="font-bold text-xs flex items-center gap-1.5 dark-text-fix force-black"><i class="fa-solid fa-address-book text-emerald-600 dark:text-[#ff3b00]"></i> KİŞİ REHBERİ</span>
                    <button onclick="closeContactsBookModal()" class="text-stone-400 hover:text-stone-600 dark:hover:text-white p-1"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div class="relative">
                    <i class="fa-solid fa-search absolute left-3 top-2.5 text-[10px] text-stone-400"></i>
                    <input type="text" id="contact-search-input" oninput="filterContactsList(this.value)" placeholder="İsim veya ID ile ara..." class="w-full bg-white dark:bg-[#14161b] border border-stone-300 dark:border-white/10 rounded-xl py-2 pl-8 pr-3 text-xs dark:text-white focus:outline-none focus:border-stone-500 placeholder-stone-400 shadow-inner" />
                </div>
            </div>

            <div id="contacts-list-container" class="flex-1 overflow-y-auto flex flex-col gap-2 max-h-[35vh] hide-scrollbar pr-1 mb-3"></div>

            <div class="grid grid-cols-2 gap-2 px-1">
                <button onclick="closeContactsBookModal(); openAddContactModal();" class="device-btn-71 device-btn-primary" title="Yeni Kişi Ekle">
                    <i class="fa-solid fa-user-plus mr-1 text-white"></i> <span class="font-bold text-xs text-white">Yeni Ekle</span>
                </button>
                <button onclick="closeContactsBookModal()" class="device-btn-71" title="Kapat">
                    <span>Kapat</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCbUororrfe0QulrSrxaWONdOhkHaTtIBs",
            authDomain: "pagertrk.firebaseapp.com",
            databaseURL: "https://pagertrk-default-rtdb.firebaseio.com",
            projectId: "pagertrk",
            storageBucket: "pagertrk.firebasestorage.app",
            messagingSenderId: "151073272542",
            appId: "1:151073272542:web:7ef74267da5bf3f128884f",
            measurementId: "G-3X4R8ST9PM"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let inboxInitialized = false;
        let globalInitialized = false;

        let currentChannel = "GLOBAL_EMERGENCY"; 
        let activeListenerRef = null;
        let soundEnabled = true;
        let notificationsActive = true; 
        
        const renderedMessageIds = new Set();
        const unreadMap = {}; 
        
        let myIdShort = localStorage.getItem('pager_my_id');
        if (!myIdShort) {
            myIdShort = Math.random().toString(36).substring(2, 6).toUpperCase();
            localStorage.setItem('pager_my_id', myIdShort);
        }

        let contacts = JSON.parse(localStorage.getItem('pager_contacts') || '{}');
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function triggerUltraHDConfetti() {
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 120,
                    spread: 80,
                    origin: { y: 0.6 },
                    colors: ['#ff3b00', '#10B981', '#FFD700', '#00E5FF', '#FF007F']
                });
            }
        }

        function playMeowSound() {
            initAudio();
            try {
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(450, now);
                osc.frequency.exponentialRampToValueAtTime(850, now + 0.15);
                osc.frequency.exponentialRampToValueAtTime(300, now + 0.45);

                gain.gain.setValueAtTime(0.01, now);
                gain.gain.linearRampToValueAtTime(0.2, now + 0.1);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start(now);
                osc.stop(now + 0.45);
            } catch (e) {}
        }

        function playPagerAlert() {
            if (!soundEnabled) return;
            initAudio();
            try {
                const now = audioCtx.currentTime;
                [0, 0.12, 0.24].forEach(offset => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(2000, now + offset);
                    gain.gain.setValueAtTime(0.06, now + offset);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.06);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + offset);
                    osc.stop(now + offset + 0.06);
                });
            } catch (e) {}
        }

        function initTheme() {
            const isDark = localStorage.getItem('pager_theme') === 'dark';
            if (isDark) {
                applyDarkMode(true);
            }
        }

        function toggleTheme() {
            initAudio();
            const isDark = document.body.classList.toggle('dark-mode');
            localStorage.setItem('pager_theme', isDark ? 'dark' : 'light');
            applyDarkMode(isDark);
            renderContactTabs();
        }

        function applyDarkMode(isDark) {
            const addTopBtn = document.getElementById('add-contact-top-btn');
            const sendBtn = document.getElementById('send-btn');

            if (isDark) {
                document.body.classList.add('dark-mode');
                if(addTopBtn) { addTopBtn.style.backgroundColor = "#ff3b00"; }
                if(sendBtn) { sendBtn.style.backgroundColor = "#ff3b00"; }
            } else {
                document.body.classList.remove('dark-mode');
                if(addTopBtn) { addTopBtn.style.backgroundColor = "#2c2b29"; }
                if(sendBtn) { sendBtn.style.backgroundColor = "#2c2b29"; }
            }
        }

        db.ref('.info/connected').on('value', (snap) => {
            const led = document.getElementById('led-indicator');
            const netStatus = document.getElementById('net-status');
            if (snap.val() === true) {
                led.className = "w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse";
                netStatus.innerText = "ÇEVRİMİÇİ (BAĞLI)";
                netStatus.className = "text-[9px] text-emerald-600 dark:text-[#ff3b00] font-semibold";
            } else {
                led.className = "w-2.5 h-2.5 rounded-full bg-red-400";
                netStatus.innerText = "ÇEVRİMDIŞI (YENİDEN BAĞLANILIYOR...)";
                netStatus.className = "text-[9px] text-red-500 font-semibold";
            }
        });

        function toggleNotifications() {
            initAudio();
            if ('Notification' in window) {
                if (Notification.permission === 'granted') {
                    notificationsActive = !notificationsActive;
                    updateNotificationButtonUI();
                } else {
                    Notification.requestPermission().then(permission => {
                        if (permission === 'granted') {
                            notificationsActive = true;
                            updateNotificationButtonUI();
                        } else {
                            notificationsActive = false;
                            updateNotificationButtonUI();
                        }
                    });
                }
            }
        }

        function updateNotificationButtonUI() {
            const btn = document.getElementById('notif-toggle-btn');
            const icon = document.getElementById('notif-icon');
            if (notificationsActive) {
                btn.className = "p-1.5 rounded-full bg-stone-100 hover:bg-stone-200 border border-stone-300 font-bold btn-6565 shadow-xs";
                icon.className = "fa-solid fa-bell text-[11px] force-black";
            } else {
                btn.className = "p-1.5 rounded-full bg-stone-200 border border-stone-300 font-bold btn-6565 shadow-xs";
                icon.className = "fa-solid fa-bell-slash text-[11px] force-black";
            }
        }

        function triggerSystemNotification(title, bodyText) {
            if (!notificationsActive) return; 
            if ('Notification' in window && Notification.permission === 'granted') {
                new Notification(title, { body: bodyText, icon: 'https://cdn-icons-png.flaticon.com/512/3602/3602145.png' });
            }
        }

        function copyMyId() { 
            navigator.clipboard.writeText(myIdShort).then(() => alert(`Kendi ID'niz kopyalandı: ${myIdShort}`)); 
        }

        function clearCurrentChannelMessages() {
            initAudio();
            const channelNameDisplay = currentChannel === "GLOBAL_EMERGENCY" ? "ALL Kanalı" : "Bu Özel Hat";
            if (confirm(`${channelNameDisplay} içerisindeki TÜM mesajlar silinecektir. Onaylıyor musunuz?`)) {
                db.ref(`messages_${currentChannel}`).remove().then(() => {
                    document.getElementById('chat-messages').innerHTML = '';
                    renderedMessageIds.clear();
                });
            }
        }

        function encryptText(text, key) {
            let result = '';
            for (let i = 0; i < text.length; i++) {
                result += String.fromCharCode(text.charCodeAt(i) ^ key.charCodeAt(i % key.length));
            }
            return btoa(unescape(encodeURIComponent(result)));
        }

        function decryptText(cipherText, key) {
            try {
                let decoded = decodeURIComponent(escape(atob(cipherText)));
                let result = '';
                for (let i = 0; i < decoded.length; i++) {
                    result += String.fromCharCode(decoded.charCodeAt(i) ^ key.charCodeAt(i % key.length));
                }
                return result;
            } catch (e) {
                return "[Şifreli Veri]";
            }
        }

        function sendConfettiSignal() {
            playMeowSound();
            triggerUltraHDConfetti();

            const signalObj = {
                id: 'confetti_' + Date.now(),
                type: 'confetti_signal',
                sender: myIdShort,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };

            db.ref(`messages_${currentChannel}`).push(signalObj);

            if (currentChannel !== "GLOBAL_EMERGENCY" && window.activeTargetFriend) {
                db.ref(`inbox_${window.activeTargetFriend}`).push({
                    from: myIdShort,
                    channel: currentChannel,
                    preview: '🎉 [Konfeti Sinyali]',
                    time: signalObj.time
                });
            }
        }

        function handleFileSelected(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(uploadEvent) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    const maxDim = 800;

                    if (width > height && width > maxDim) {
                        height *= maxDim / width;
                        width = maxDim;
                    } else if (height > maxDim) {
                        width *= maxDim / height;
                        height = maxDim;
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    const compressedBase64 = canvas.toDataURL('image/jpeg', 0.7);
                    sendPayload({
                        type: 'image',
                        content: compressedBase64,
                        previewText: '[Fotoğraf]'
                    });
                };
                img.src = uploadEvent.target.result;
            };
            reader.readAsDataURL(file);
            event.target.value = '';
        }

        function openAddContactModal() {
            initAudio();
            const modal = document.getElementById('contact-modal');
            const content = document.getElementById('contact-modal-content');
            modal.style.display = 'flex';
            setTimeout(() => content.classList.add('show'), 10);
        }

        function closeAddContactModal() {
            const modal = document.getElementById('contact-modal');
            const content = document.getElementById('contact-modal-content');
            content.classList.remove('show');
            setTimeout(() => modal.style.display = 'none', 300);
        }

        function openContactsBookModal() {
            initAudio();
            const modal = document.getElementById('contacts-book-modal');
            const content = document.getElementById('contacts-book-content');
            modal.style.display = 'flex';
            setTimeout(() => content.classList.add('show'), 10);
            document.getElementById('contact-search-input').value = '';
            renderContactsList();
        }

        function closeContactsBookModal() {
            const modal = document.getElementById('contacts-book-modal');
            const content = document.getElementById('contacts-book-content');
            content.classList.remove('show');
            setTimeout(() => modal.style.display = 'none', 300);
        }

        function saveContact() {
            const idInput = document.getElementById('friend-id-input').value.trim().toUpperCase();
            const nameInput = document.getElementById('friend-name-input').value.trim() || idInput;
            
            if (idInput.length !== 4) {
                alert("Lütfen 4 haneli geçerli bir ID girin.");
                return;
            }
            if (idInput === myIdShort) {
                alert("Kendinizi rehbere ekleyemezsiniz.");
                return;
            }

            contacts[idInput] = nameInput;
            localStorage.setItem('pager_contacts', JSON.stringify(contacts));
            
            closeAddContactModal();
            document.getElementById('friend-id-input').value = '';
            document.getElementById('friend-name-input').value = '';
            
            renderContactTabs();
            switchChannel(`dm_${getDmKey(myIdShort, idInput)}`, nameInput, idInput);
        }

        function deleteContact(friendId, event) {
            event.stopPropagation();
            if (confirm(`"${contacts[friendId]}" kişisini rehberden silmek istediğinize emin misiniz?`)) {
                delete contacts[friendId];
                localStorage.setItem('pager_contacts', JSON.stringify(contacts));
                renderContactTabs();
                renderContactsList();
                
                if (currentChannel.includes(friendId)) {
                    switchToGlobalChannel();
                }
            }
        }

        function renderContactsList(filterQuery = '') {
            const container = document.getElementById('contacts-list-container');
            let html = '';
            
            const entries = Object.entries(contacts);
            if (entries.length === 0) {
                container.innerHTML = `<div class="text-center text-stone-500 py-6 text-xs font-medium">Rehberinizde henüz kayıtlı kişi yok.</div>`;
                return;
            }

            const query = filterQuery.toLowerCase();
            let count = 0;
            const isDark = document.body.classList.contains('dark-mode');

            for (const [friendId, friendName] of entries) {
                if (query && !friendName.toLowerCase().includes(query) && !friendId.toLowerCase().includes(query)) {
                    continue;
                }
                count++;

                html += `
                    <div onclick="closeContactsBookModal(); switchChannel('dm_${getDmKey(myIdShort, friendId)}', '${friendName}', '${friendId}')" 
                         class="flex items-center justify-between p-2.5 rounded-xl ${isDark ? 'bg-gray-800/90 border border-white/10 text-gray-100' : 'bg-white/90 border border-stone-300/80 text-stone-800 shadow-xs'} cursor-pointer transition">
                        <div class="flex items-center gap-2.5">
                            <div class="w-8 h-8 rounded-lg ${isDark ? 'bg-[#ff3b00] text-white' : 'bg-[#2c2b29] text-white'} flex items-center justify-center font-bold text-xs">
                                <i class="fa-solid fa-user"></i>
                            </div>
                            <div class="flex flex-col">
                                <span class="font-bold text-xs tracking-wide ${isDark ? 'text-white' : 'text-stone-900'}">${friendName}</span>
                                <span class="font-mono text-[10px] ${isDark ? 'text-gray-300' : 'text-stone-500'}">ID: ${friendId}</span>
                            </div>
                        </div>
                        <div class="flex items-center gap-1">
                            <button onclick="deleteContact('${friendId}', event)" title="Kişiyi Sil" class="p-2 rounded-lg text-stone-400 hover:text-red-500 transition">
                                <i class="fa-solid fa-trash text-xs"></i>
                            </button>
                        </div>
                    </div>
                `;
            }

            if (count === 0) {
                html = `<div class="text-center text-stone-500 py-6 text-xs font-medium">Aradığınız kritere uygun kişi bulunamadı.</div>`;
            }

            container.innerHTML = html;
        }

        function filterContactsList(val) {
            renderContactsList(val);
        }

        function getDmKey(id1, id2) {
            return [id1, id2].sort().join('_');
        }

        function renderContactTabs() {
            const container = document.getElementById('channel-tabs');
            let html = '';
            const isDark = document.body.classList.contains('dark-mode');

            for (const [friendId, friendName] of Object.entries(contacts)) {
                const channelKey = `dm_${getDmKey(myIdShort, friendId)}`;
                const isActive = currentChannel === channelKey;
                const unreadCount = unreadMap[channelKey] || 0;

                let activeClass = '';
                if (isActive) {
                    activeClass = isDark ? 'bg-[#ff3b00] text-white font-bold border-[#ff3b00] shadow' : 'bg-[#2c2b29] text-white font-bold border-stone-800 shadow-sm';
                } else {
                    activeClass = isDark ? 'bg-gray-800/80 text-gray-100 border-white/10' : 'bg-white/80 text-stone-800 border-stone-300/80 shadow-xs';
                }

                html += `
                    <button onclick="switchChannel('${channelKey}', '${friendName}', '${friendId}')" id="tab-${channelKey}" class="px-3 py-1.5 rounded-lg ${activeClass} text-[11px] flex items-center gap-1.5 border transition flex-shrink-0 relative">
                        <i class="fa-solid fa-user text-[10px]"></i> <span class="font-bold ${!isActive && !isDark ? 'text-stone-800' : ''}">${friendName}</span>
                        ${unreadCount > 0 ? `<span class="bg-red-500 text-white text-[9px] px-1.5 py-0.2 rounded-full font-bold ml-1 animate-pulse">${unreadCount}</span>` : ''}
                    </button>
                `;
            }

            const globalUnread = unreadMap['GLOBAL_EMERGENCY'] || 0;
            const globalActive = currentChannel === 'GLOBAL_EMERGENCY';
            let globalClass = '';
            if (globalActive) {
                globalClass = isDark ? 'bg-[#ff3b00] text-white border-[#ff3b00] font-bold' : 'bg-[#2c2b29] text-white border-stone-800 font-bold shadow-sm';
            } else {
                globalClass = isDark ? 'bg-red-500/10 text-red-400 border-red-500/20' : 'bg-stone-200/80 text-stone-800 border-stone-300 shadow-xs';
            }

            html += `
                <button onclick="switchToGlobalChannel()" id="tab-GLOBAL_EMERGENCY" class="px-3 py-1.5 rounded-lg ${globalClass} text-[11px] flex items-center gap-1.5 border transition flex-shrink-0 relative">
                    <i class="fa-solid fa-tower-broadcast"></i> <span class="font-bold">HERKES</span>
                    ${globalUnread > 0 ? `<span class="bg-red-600 text-white text-[9px] px-1.5 py-0.2 rounded-full font-bold ml-1 animate-bounce">${globalUnread}</span>` : ''}
                </button>
            `;

            container.innerHTML = html;
        }

        function switchToGlobalChannel() {
            initAudio();
            currentChannel = "GLOBAL_EMERGENCY";
            unreadMap['GLOBAL_EMERGENCY'] = 0; 
            renderedMessageIds.clear();
            document.getElementById('active-chat-title').innerText = "ORTAK ALAN";
            renderContactTabs();
            switchChannelListener("messages_GLOBAL_EMERGENCY", "GLOBAL_EMERGENCY");
        }

        function switchChannel(channelKey, titleName, friendId) {
            initAudio();
            currentChannel = channelKey;
            window.activeTargetFriend = friendId; 
            window.activeTargetFriendName = titleName;
            unreadMap[channelKey] = 0; 
            renderedMessageIds.clear();
            document.getElementById('active-chat-title').innerText = titleName ? `ÖZEL HAT: ${titleName}` : "ÖZEL HAT";
            renderContactTabs();
            switchChannelListener(`messages_${channelKey}`, channelKey);
        }

        function switchChannelListener(firebasePath, encryptionKey) {
            document.getElementById('chat-messages').innerHTML = '';
            if (activeListenerRef) activeListenerRef.off();

            const channelOpenTime = Date.now();
            activeListenerRef = db.ref(firebasePath);

            activeListenerRef.on('child_added', (snapshot) => {
                const msg = snapshot.val();
                if (!msg || renderedMessageIds.has(msg.id)) return;
                
                renderedMessageIds.add(msg.id);
                
                if (msg.type === 'confetti_signal') {
                    const msgTimestamp = parseInt(msg.id?.replace('confetti_', '')) || 0;
                    if (msg.sender !== myIdShort && msgTimestamp > channelOpenTime) {
                        playPagerAlert();
                        playMeowSound();
                        triggerUltraHDConfetti();
                        triggerSystemNotification(`PAGER // ${msg.sender}`, "🎉 Konfeti Patlatıldı!");
                    }
                    return;
                }

                renderMessage(msg, encryptionKey);
                
                const msgTimestamp = parseInt(msg.id?.replace('msg_', '')) || 0;
                if (msg.sender !== myIdShort && msgTimestamp > channelOpenTime) {
                    playPagerAlert();
                    const decryptedText = msg.type === 'image' ? '[Fotoğraf Alındı]' : decryptText(msg.encryptedText, encryptionKey);
                    triggerSystemNotification(`PAGER // ${msg.sender}`, decryptedText);
                }
            });
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            initAudio();
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;

            sendPayload({
                type: 'text',
                content: text,
                previewText: text
            });

            input.value = '';
        }

        function sendPayload(payloadObj) {
            const encrypted = (payloadObj.type === 'text') ? encryptText(payloadObj.content, currentChannel) : payloadObj.content;

            const msgObj = {
                id: 'msg_' + Date.now(),
                type: payloadObj.type,
                sender: myIdShort,
                encryptedText: encrypted,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };

            if (!renderedMessageIds.has(msgObj.id)) {
                renderedMessageIds.add(msgObj.id);
                renderMessage(msgObj, currentChannel);
            }

            db.ref(`messages_${currentChannel}`).push(msgObj);

            if (currentChannel !== "GLOBAL_EMERGENCY" && window.activeTargetFriend) {
                db.ref(`inbox_${window.activeTargetFriend}`).push({
                    from: myIdShort,
                    channel: currentChannel,
                    preview: payloadObj.previewText.substring(0, 30),
                    time: msgObj.time
                });
            }
        }

        function renderMessage(m, encryptionKey) {
            const container = document.getElementById('chat-messages');
            const isMe = m.sender === myIdShort;
            const isDark = document.body.classList.contains('dark-mode');
            
            let contentHtml = '';
            if (m.type === 'image') {
                contentHtml = `<img src="${m.encryptedText}" class="rounded-lg max-w-full h-auto max-h-48 object-cover border border-black/10 cursor-pointer shadow" onclick="window.open(this.src)" />`;
            } else {
                contentHtml = decryptText(m.encryptedText, encryptionKey);
            }
            
            let bubbleClass = '';
            if (isMe) {
                bubbleClass = isDark ? 'bg-[#ff3b00] text-white rounded-tr-none font-medium' : 'bg-[#2c2b29] text-white rounded-tr-none font-medium shadow-sm';
            } else {
                bubbleClass = isDark ? 'bg-gray-800 text-gray-100 rounded-tl-none font-medium border border-white/10' : 'bg-white text-stone-800 rounded-tl-none font-medium border border-stone-300/80 shadow-xs';
            }

            const msgEl = document.createElement('div');
            msgEl.className = `flex flex-col gap-0.5 max-w-[85%] ${isMe ? 'self-end items-end' : 'self-start items-start'}`;
            msgEl.innerHTML = `
                <div class="text-[9px] text-stone-500 px-1 font-mono font-semibold"><b>${m.sender}</b> ${m.time}</div>
                <div class="px-3 py-2 rounded-xl text-xs shadow-md ${bubbleClass}">
                    ${contentHtml}
                </div>
            `;
            container.appendChild(msgEl);
            container.scrollTop = container.scrollHeight;
        }

        function initBackgroundPager() {
            db.ref(`inbox_${myIdShort}`).on('child_added', (snapshot) => {
                const data = snapshot.val();
                if (!data || data.from === myIdShort) return;

                if (data.channel && data.channel !== currentChannel) {
                    unreadMap[data.channel] = (unreadMap[data.channel] || 0) + 1;
                    renderContactTabs();
                }

                if (inboxInitialized) {
                    playPagerAlert();
                    triggerSystemNotification(`YENİ ÇAĞRI [${data.from}]`, data.preview || "Özel mesaj alındı.");
                }
            });

            db.ref('messages_GLOBAL_EMERGENCY').on('child_added', (snapshot) => {
                const msg = snapshot.val();
                if (!msg || msg.sender === myIdShort) return;

                if (globalInitialized && currentChannel !== 'GLOBAL_EMERGENCY') {
                    unreadMap['GLOBAL_EMERGENCY'] = (unreadMap['GLOBAL_EMERGENCY'] || 0) + 1;
                    renderContactTabs();
                    playPagerAlert();
                }
            });
        }

        window.onload = () => {
            initTheme();
            document.getElementById('my-identity').innerText = `ID: ${myIdShort}`;

            db.ref(`inbox_${myIdShort}`).once('value', () => {
                inboxInitialized = true;
            });
            db.ref('messages_GLOBAL_EMERGENCY').once('value', () => {
                globalInitialized = true;
            });

            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker Kaydedildi:', reg))
                    .catch(err => console.error('Service Worker Kayıt Hatası:', err));
            }

            if ('Notification' in window && Notification.permission === 'default') {
                Notification.requestPermission();
            }

            document.body.addEventListener('click', () => initAudio(), { once: true });
            
            initBackgroundPager();
            renderContactTabs();
            switchToGlobalChannel();
        };
    </script>
</body>
</html>
