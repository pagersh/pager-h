<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- Apple PWA ve Safari Tam Ekran Meta Etiketleri -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="HAMZACHAT">
    
    <title>HAMZACHAT // Encrypted Firebase Pager</title>
    
    <!-- Harici Manifest Bağlantısı -->
    <link rel="manifest" href="manifest.json">

    <!-- Firebase SDK (Compat - CDN) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --pastel-bg: #EFECE6;        
            --pastel-card: #F7F5F0;      
            --pastel-accent: #A8BBA2;    
            --text-dark: #383734;
            --text-muted: #7C7A75;
            --border-soft: rgba(56, 55, 52, 0.08);
            --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        body {
            background-color: var(--pastel-bg);
            color: var(--text-dark);
            font-family: var(--font-sans);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 0.25rem;
            overflow: hidden;
        }

        /* iOS ve Mobil Klavye Çözümü */
        input, textarea, button {
            -webkit-user-select: text !important;
            user-select: text !important;
        }

        .pastel-card {
            background-color: var(--pastel-card);
            border: 1px solid var(--border-soft);
            box-shadow: 0 8px 24px rgba(56, 55, 52, 0.04);
        }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body>

    <div class="w-full max-w-md h-[95vh] max-h-[720px] flex flex-col gap-1.5 relative overflow-hidden p-1.5">
        
        <!-- ÜST BİLGİ & ODA & BİLDİRİM ÇUBUĞU -->
        <div class="pastel-card rounded-xl px-2.5 py-2 flex flex-col gap-1.5 text-xs z-10">
            <div class="flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <span id="led-indicator" class="w-2.5 h-2.5 rounded-full bg-stone-400"></span>
                    <div class="flex flex-col">
                        <div class="flex items-center gap-1">
                            <span id="my-identity" onclick="copyMyId()" class="font-mono font-bold text-[var(--text-dark)] cursor-pointer" title="ID Kopyala">Yükleniyor...</span>
                        </div>
                        <span id="net-status" class="text-[9px] text-[var(--text-muted)]">ÇEVRİMDIŞI</span>
                    </div>
                </div>
                
                <div class="flex items-center gap-1">
                    <!-- Oda Oluştur Butonu -->
                    <button onclick="createNewRoom()" title="Yeni Oda Oluştur" class="px-2 py-1 rounded-lg bg-[var(--pastel-accent)] hover:opacity-90 text-[var(--text-dark)] font-semibold transition border border-emerald-300 text-[10px] flex items-center gap-1">
                        <i class="fa-solid fa-plus text-[10px]"></i> Oda Oluştur
                    </button>
                    <!-- Bildirim Açma / Kapatma Toggle Butonu -->
                    <button id="notif-toggle-btn" onclick="toggleNotifications()" title="Bildirimleri Aç/Kapat" class="p-1.5 rounded-lg bg-emerald-100 text-emerald-800 transition border border-emerald-300">
                        <i id="notif-icon" class="fa-solid fa-bell text-[11px]"></i>
                    </button>
                    <!-- Mesajları Temizle Butonu -->
                    <button onclick="clearCloudMessages()" title="Temizle" class="p-1.5 rounded-lg bg-white/60 hover:bg-white hover:text-red-500 transition border border-[var(--border-soft)]">
                        <i class="fa-solid fa-trash text-[11px]"></i>
                    </button>
                </div>
            </div>

            <!-- ODA KATILMA VE MEVCUT ODA BİLGİSİ -->
            <div class="flex justify-between items-center bg-white/50 p-1.5 rounded-lg border border-[var(--border-soft)]">
                <div class="flex items-center gap-1 font-mono text-[11px]">
                    <span class="text-[var(--text-muted)]">ODA:</span>
                    <span id="current-room-display" class="font-bold text-emerald-700 bg-emerald-100 px-1.5 py-0.5 rounded">0000</span>
                </div>

                <form onsubmit="handleJoinRoom(event)" class="flex items-center gap-1">
                    <input type="text" id="room-code-input" placeholder="4 Haneli Kod" maxlength="4" autocomplete="off"
                           class="w-24 bg-white border border-[var(--border-soft)] rounded-lg py-1 px-2 text-[11px] font-mono text-[var(--text-dark)] focus:outline-none focus:ring-1 focus:ring-[var(--pastel-accent)]" />
                    <button type="submit" class="px-2 py-1 rounded-lg bg-stone-200 hover:bg-stone-300 text-[10px] font-semibold transition">
                        Katıl
                    </button>
                </form>
            </div>
        </div>

        <!-- ANA PAGER EKRANI -->
        <div class="pastel-card rounded-2xl p-2.5 flex-1 flex flex-col justify-between gap-2 overflow-hidden relative">
            
            <div class="flex justify-between items-center px-1 py-0.5 border-b border-[var(--border-soft)] text-xs">
                <div class="flex items-center gap-1">
                    <i class="fa-solid fa-lock text-emerald-600"></i>
                    <span class="font-semibold text-[var(--text-dark)]">PAGER // SHIELD ENCRYPTED</span>
                </div>
                <div class="flex items-center gap-2 font-mono text-[10px] text-[var(--text-muted)]">
                    <span id="net-label">BULUT BAĞLI</span>
                </div>
            </div>

            <!-- MESAJ AKIŞ ALANI -->
            <div id="chat-messages" class="flex-1 overflow-y-auto hide-scrollbar flex flex-col gap-2 pr-0.5 justify-end"></div>

            <!-- MESAJ GİRİŞ FORMU -->
            <div class="flex flex-col gap-1 pt-1.5 pb-1 border-t border-[var(--border-soft)]">
                <form id="chat-form" onsubmit="handleFormSubmit(event)" class="flex items-center gap-1.5">
                    <input type="text" id="chat-input" placeholder="Şifreli mesaj girin..." autocomplete="off"
                           class="flex-1 bg-white border border-[var(--border-soft)] rounded-xl py-2 px-3 text-xs text-[var(--text-dark)] placeholder-[var(--text-muted)] focus:outline-none focus:ring-1 focus:ring-[var(--pastel-accent)] transition shadow-xs" />
                    
                    <button type="submit" class="w-9 h-9 rounded-xl bg-[var(--pastel-accent)] hover:opacity-90 text-[var(--text-dark)] flex items-center justify-center transition active:scale-95 flex-shrink-0 shadow-sm">
                        <i class="fa-solid fa-paper-plane text-xs"></i>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCbUororrfe0QulrSrxaWONdOhkHaTtIBs",
            authDomain: "pagertrk.firebaseapp.com",
            databaseURL: "https://pagertrk-default-rtdb.firebaseio.com",
            projectId: "pagertrk",
            storageBucket: "pagertrk.firebasestorage.app",
            messagingSenderId: "151073272542",
            appId: "1:151073272542:web:7ef74267da5bf3f128884f",
            measurementId: "G-3X4R8ST9PM"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentRoom = "0000"; 
        let activeListenerRef = null;
        let soundEnabled = true;
        let notificationsActive = true; 
        let myIdShort = Math.random().toString(36).substring(2, 6).toUpperCase();
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playPagerAlert() {
            if (!soundEnabled) return;
            initAudio();
            try {
                const now = audioCtx.currentTime;
                [0, 0.12, 0.24].forEach(offset => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(2000, now + offset);
                    gain.gain.setValueAtTime(0.06, now + offset);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.06);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + offset);
                    osc.stop(now + offset + 0.06);
                });
            } catch (e) {}
        }

        // --- BİLDİRİM AÇ/KAPAT VE İZİN İSTEME MİMARİSİ ---
        function toggleNotifications() {
            initAudio();
            if ('Notification' in window) {
                if (Notification.permission === 'granted') {
                    // İzin zaten varsa doğrudan durumu tersine çevir (aç/kapat)
                    notificationsActive = !notificationsActive;
                    updateNotificationButtonUI();
                } else {
                    // İzin verilmemişse veya engellenmişse tekrar tarayıcıdan izin iste
                    Notification.requestPermission().then(permission => {
                        if (permission === 'granted') {
                            notificationsActive = true;
                            updateNotificationButtonUI();
                        } else {
                            notificationsActive = false;
                            updateNotificationButtonUI();
                            alert('Bildirim izni verilmedi. Tarayıcı ayarlarından izin vermeniz gerekebilir.');
                        }
                    });
                }
            } else {
                alert('Tarayıcınız bildirimleri desteklemiyor.');
            }
        }

        function updateNotificationButtonUI() {
            const btn = document.getElementById('notif-toggle-btn');
            const icon = document.getElementById('notif-icon');
            if (notificationsActive) {
                btn.className = "p-1.5 rounded-lg bg-emerald-100 text-emerald-800 transition border border-emerald-300";
                icon.className = "fa-solid fa-bell text-[11px]";
            } else {
                btn.className = "p-1.5 rounded-lg bg-stone-200 text-stone-500 transition border border-stone-300";
                icon.className = "fa-solid fa-bell-slash text-[11px]";
            }
        }

        function triggerSystemNotification(title, bodyText) {
            if (!notificationsActive) return; 
            if ('Notification' in window && Notification.permission === 'granted') {
                new Notification(title, { body: bodyText, icon: 'https://cdn-icons-png.flaticon.com/512/3602/3602145.png' });
            }
        }

        function copyMyId() { 
            navigator.clipboard.writeText(myIdShort).then(() => alert(`Kimlik ID: ${myIdShort}`)); 
        }

        // --- UÇTAN UCA ŞİFRELEME (E2EE) ---
        function encryptText(text, key) {
            let result = '';
            for (let i = 0; i < text.length; i++) {
                result += String.fromCharCode(text.charCodeAt(i) ^ key.charCodeAt(i % key.length));
            }
            return btoa(unescape(encodeURIComponent(result)));
        }

        function decryptText(cipherText, key) {
            try {
                let decoded = decodeURIComponent(escape(atob(cipherText)));
                let result = '';
                for (let i = 0; i < decoded.length; i++) {
                    result += String.fromCharCode(decoded.charCodeAt(i) ^ key.charCodeAt(i % key.length));
                }
                return result;
            } catch (e) {
                return "[Şifreli Veri - Yetkisiz Oda]";
            }
        }

        // --- ODA YÖNETİMİ & RASTGELE KOD ---
        async function createNewRoom() {
            initAudio();
            let uniqueCode = "";
            let exists = true;
            
            while (exists) {
                uniqueCode = Math.floor(1000 + Math.random() * 9000).toString();
                const snapshot = await db.ref(`rooms/${uniqueCode}`).once('value');
                if (!snapshot.exists()) exists = false;
            }

            await db.ref(`rooms/${uniqueCode}`).set({ created: Date.now(), owner: myIdShort });
            switchRoom(uniqueCode);
            alert(`Yeni Şifreli Oda Oluşturuldu!\nOda Kodu: ${uniqueCode}\n(Bu 4 haneli kodu arkadaşlarınızla paylaşın).`);
        }

        function handleJoinRoom(e) {
            e.preventDefault();
            initAudio();
            const input = document.getElementById('room-code-input');
            const code = input.value.trim();
            if (code.length === 4) {
                switchRoom(code);
                input.value = '';
            } else {
                alert("Lütfen 4 haneli geçerli bir oda kodu girin.");
            }
        }

        function switchRoom(roomCode) {
            currentRoom = roomCode;
            document.getElementById('current-room-display').innerText = roomCode;
            document.getElementById('chat-messages').innerHTML = '';

            if (activeListenerRef) activeListenerRef.off();

            activeListenerRef = db.ref(`messages_${currentRoom}`);
            activeListenerRef.on('child_added', (snapshot) => {
                const msg = snapshot.val();
                renderMessage(msg);
                
                if (msg.sender !== myIdShort) {
                    playPagerAlert();
                    const decryptedText = decryptText(msg.encryptedText, currentRoom);
                    triggerSystemNotification(`PAGER [Oda ${currentRoom}] // ${msg.sender}`, decryptedText);
                }
            });
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            initAudio();
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;

            const encrypted = encryptText(text, currentRoom);

            const msgObj = {
                id: 'msg_' + Date.now(),
                sender: myIdShort,
                encryptedText: encrypted,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };

            db.ref(`messages_${currentRoom}`).push(msgObj);
            input.value = '';
        }

        function clearCloudMessages() {
            if (confirm(`Oda ${currentRoom} mesajları tamamen silinsin mi?`)) {
                db.ref(`messages_${currentRoom}`).remove();
                document.getElementById('chat-messages').innerHTML = '';
            }
        }

        function renderMessage(m) {
            const container = document.getElementById('chat-messages');
            const isMe = m.sender === myIdShort;
            const decryptedText = decryptText(m.encryptedText, currentRoom);
            
            const msgEl = document.createElement('div');
            msgEl.className = `flex flex-col gap-0.5 max-w-[85%] ${isMe ? 'self-end items-end' : 'self-start items-start'}`;
            msgEl.innerHTML = `
                <div class="text-[9px] text-[var(--text-muted)] px-1 font-mono"><b>${m.sender}</b> ${m.time}</div>
                <div class="px-3 py-2 rounded-xl text-xs shadow-xs border border-[var(--border-soft)] ${isMe ? 'bg-[var(--pastel-accent)] rounded-tr-none' : 'bg-white rounded-tl-none'}">
                    ${decryptedText}
                </div>
            `;
            container.appendChild(msgEl);
            container.scrollTop = container.scrollHeight;
        }

        window.onload = () => {
            document.getElementById('my-identity').innerText = `ID: ${myIdShort}`;
            const led = document.getElementById('led-indicator');
            const netStatus = document.getElementById('net-status');
            
            led.className = "w-2.5 h-2.5 rounded-full bg-[var(--pastel-accent)] animate-pulse";
            netStatus.innerText = "SİNYAL (ŞİFRELİ)";

            if ('Notification' in window && Notification.permission === 'default') {
                Notification.requestPermission();
            }

            document.body.addEventListener('click', () => initAudio(), { once: true });
            switchRoom("0000");
        };
    </script>
</body>
</html>
