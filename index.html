<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Habit Stamp" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2693/2693507.png" />
  <title>Habit Tracker — Boyanabilir Damga</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase Realtime Database SDK (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Pacifico&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --ink: #111111;
      --paper: #ffffff;
      --desk: #f3f2ee;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--desk);
      background-image: radial-gradient(#d8d5cd 1px, transparent 1px);
      background-size: 20px 20px;
      color: var(--ink);
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      padding-top: max(0.75rem, env(safe-area-inset-top));
      padding-right: max(0.625rem, env(safe-area-inset-right));
      padding-bottom: max(0.75rem, env(safe-area-inset-bottom));
      padding-left: max(0.625rem, env(safe-area-inset-left));
    }

    /* iPhone / PWA standalone modda Safari çubuğu olmadan tam ekran görünüm */
    @media all and (display-mode: standalone) {
      body {
        background-color: var(--paper);
        background-image: none;
        padding-top: max(1rem, env(safe-area-inset-top));
        padding-bottom: max(1rem, env(safe-area-inset-bottom));
      }
    }

    .font-script {
      font-family: 'Pacifico', cursive;
    }

    .font-hand {
      font-family: 'Caveat', cursive;
    }

    /* Damga kağıdı görünümü */
    .stamp-sheet {
      background-color: var(--paper);
      border-radius: 18px;
      box-shadow:
        0 18px 40px -15px rgba(17, 17, 17, 0.12),
        0 2px 6px rgba(17, 17, 17, 0.05);
      position: relative;
      overflow: visible;
    }

    /* Kurdele şeridi içindeki alışkanlık yazma alanı */
    .banner-input {
      font-family: 'Caveat', cursive;
      font-weight: 700;
      color: var(--ink);
      background: transparent;
      border: none;
      outline: none;
      text-align: center;
      width: 100%;
      line-height: 1.05;
      letter-spacing: 0.01em;
    }

    .banner-input::placeholder {
      color: rgba(17, 17, 17, 0.28);
      font-weight: 600;
    }

    /* 7x5 Takvim / Alışkanlık Izgarası */
    .tracker-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      grid-template-rows: repeat(5, minmax(0, 1fr));
      width: 100%;
      aspect-ratio: 7 / 5;
      user-select: none;
      touch-action: none;
      position: relative;
    }

    .grid-cell {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      overflow: hidden;
      transition: background-color 0.14s ease, transform 0.12s ease;
    }

    .grid-cell:active {
      transform: scale(0.96);
    }

    .grid-cell .cell-number {
      font-family: 'Caveat', cursive;
      font-weight: 600;
      line-height: 1;
      z-index: 3;
      position: relative;
      pointer-events: none;
      transition: color 0.15s ease, opacity 0.15s ease;
    }

    .grid-cell .cell-day-name {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.02em;
      line-height: 1;
      z-index: 3;
      position: relative;
      pointer-events: none;
      transition: color 0.15s ease, opacity 0.15s ease;
    }

    @media (min-width: 640px) {
      .grid-cell .cell-day-name {
        font-size: 10px;
      }
    }

    .grid-cell .cell-mark {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
      pointer-events: none;
    }

    /* Boya fırçası / damga dolgu katmanı */
    .grid-cell .cell-fill {
      position: absolute;
      inset: 2px;
      border-radius: 6px;
      z-index: 1;
      opacity: 0;
      transform: scale(0.84);
      transition: opacity 0.16s ease, transform 0.18s cubic-bezier(0.22, 1, 0.36, 1);
      pointer-events: none;
    }

    .grid-cell.painted .cell-fill {
      opacity: 0.88;
      transform: scale(1);
    }

    /* Gizli not göstergesi */
    .grid-cell .note-badge {
      position: absolute;
      top: 3px;
      right: 3px;
      width: 8px;
      height: 8px;
      border-radius: 9999px;
      background: #111111;
      border: 1.5px solid #ffffff;
      z-index: 4;
      pointer-events: none;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
    }

    /* Seçili gün vurgusu */
    .grid-cell.selected-day {
      box-shadow: inset 0 0 0 2.5px #111111;
    }

    /* 0% İlerleme butonu içindeki açılır popover menü */
    .percent-popover {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      width: 248px;
      background: #ffffff;
      border: 1.5px solid #111111;
      border-radius: 16px;
      box-shadow: 0 18px 36px -10px rgba(17, 17, 17, 0.26);
      padding: 12px;
      z-index: 40;
      transform-origin: top right;
      transition: opacity 0.16s ease, transform 0.18s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .percent-popover.hidden-pop {
      opacity: 0;
      transform: scale(0.94) translateY(-4px);
      pointer-events: none;
    }

    /* Gizli gün notu pop-up (Modal) */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(17, 17, 17, 0.45);
      backdrop-filter: blur(2px);
      z-index: 60;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease;
    }

    .modal-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: #ffffff;
      border: 2.5px solid #111111;
      border-radius: 18px;
      box-shadow: 6px 8px 0px #111111;
      width: 100%;
      max-width: 380px;
      padding: 18px;
      transform: scale(0.95) translateY(8px);
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .modal-backdrop.open .modal-card {
      transform: scale(1) translateY(0);
    }

    /* Dikey yan yazılar: \ good / ve \ nice / */
    .side-word-good {
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      font-family: 'Caveat', cursive;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--ink);
      user-select: none;
    }

    .side-word-nice {
      writing-mode: vertical-rl;
      font-family: 'Caveat', cursive;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--ink);
      user-select: none;
    }

    /* Renk swatch butonları */
    .color-swatch {
      width: 24px;
      height: 24px;
      border-radius: 9999px;
      border: 2px solid #ffffff;
      box-shadow: 0 0 0 1.5px rgba(17, 17, 17, 0.22);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      cursor: pointer;
    }

    .color-swatch:hover {
      transform: scale(1.1);
    }

    .color-swatch.active {
      transform: scale(1.16);
      box-shadow: 0 0 0 2.5px #111111, 0 4px 10px rgba(0, 0, 0, 0.18);
    }

    /* Yazdırma görünümü */
    @media print {
      body {
        background: #ffffff !important;
        background-image: none !important;
      }
      .no-print {
        display: none !important;
      }
      .print-container {
        padding: 0 !important;
        max-width: 100% !important;
      }
      .stamp-sheet {
        box-shadow: none !important;
        border-radius: 0 !important;
      }
    }
  </style>
</head>
<body>
  <div class="print-container max-w-[620px] mx-auto flex flex-col items-center justify-center">

    <!-- GÖRSELİN BİREBİR DAMGA SAYFASI -->
    <main class="w-full">
      <div id="stampSheet" class="stamp-sheet px-3 py-4 sm:px-6 sm:py-6">

        <!-- ÜST KISIM: Yıldız + "\ Let's try it /" + Gömülü 0% Butonu + Kuşlar + Şerit -->
        <div class="relative pt-1">
          <div class="flex items-start justify-between px-1 sm:px-3">
            <!-- Sol Üst El Çizimi Yıldız ve Vurgu Çizgileri -->
            <div class="relative flex items-center pt-1 shrink-0">
              <svg class="w-11 h-11 sm:w-13 sm:h-13 text-[#111111]" viewBox="0 0 72 72" fill="none">
                <path d="M13 10 L19 20" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" />
                <path d="M6 21 L14 27" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" />
                <path d="M22 8 L25 17" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
                <path
                  d="M40 15 L44.5 27.5 L58 28 L47.2 36.2 L51 49.5 L40 41.8 L29 49.5 L32.8 36.2 L22 28 L35.5 27.5 Z"
                  stroke="currentColor"
                  stroke-width="3.2"
                  stroke-linejoin="round"
                  fill="#ffffff"
                />
              </svg>
            </div>

            <!-- Üst Orta: "\ Let's try it /" -->
            <div class="font-hand font-bold text-[#111111] text-[25px] sm:text-[34px] leading-none tracking-wide pt-1.5 select-none">
              <span class="inline-block -rotate-6 mr-1">\</span><span>Let's try it</span><span class="inline-block rotate-6 ml-1">/</span>
            </div>

            <!-- Sağ Üst: 0% İlerleme & Araç Menüsü + Kanatlı Kuş -->
            <div class="relative flex items-start gap-1 sm:gap-1.5 -mr-1 shrink-0">
              <!-- 0% Butonu (Renk ve Boyama/Damga/Not Modlarını İçinde Barındırır) -->
              <div class="no-print relative z-30 mt-1">
                <button
                  type="button"
                  id="percentMenuBtn"
                  aria-haspopup="true"
                  aria-expanded="false"
                  title="İlerleme, Renk ve Mod Menüsü"
                  class="flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-white border-2 border-[#111111] shadow-[2px_2px_0px_#111111] hover:bg-stone-50 active:translate-x-[1px] active:translate-y-[1px] transition cursor-pointer"
                >
                  <span id="currentModeBadgeColor" class="w-2.5 h-2.5 rounded-full border border-[#111111]" style="background-color: #f87171;"></span>
                  <span id="progressPercent" class="text-xs font-bold text-[#111111] leading-none">0%</span>
                  <span id="progressCountMini" class="hidden sm:inline text-[11px] font-medium text-stone-500 leading-none">0/31</span>
                  <span id="cloudSyncDot" title="Firebase Bulut Durumu" class="w-1.5 h-1.5 rounded-full bg-stone-300"></span>
                </button>

                <!-- 0% Butonunun İçinden Açılan Popover Menü -->
                <div id="percentPopover" class="percent-popover hidden-pop" role="dialog" aria-label="Renk ve Mod Seçenekleri">
                  <div class="flex items-center justify-between pb-2 mb-2.5 border-b border-stone-100">
                    <span class="text-xs font-bold text-stone-800">Araç &amp; Mürekkep</span>
                    <span id="activeModeSummary" class="text-[11px] font-semibold text-stone-500">Boya</span>
                  </div>

                  <!-- Mod Seçiciler: Boya / Tik / Yıldız / Not / Silgi -->
                  <div class="mb-3">
                    <div class="text-[11px] font-semibold text-stone-500 mb-1.5">Mod Seçimi</div>
                    <div class="grid grid-cols-5 gap-1" id="modeButtons">
                      <button
                        type="button"
                        data-mode="fill"
                        title="Tam Kutu Boyama"
                        class="mode-btn flex flex-col items-center justify-center py-1.5 px-0.5 rounded-lg border border-stone-200 bg-stone-50 text-stone-700 text-[10px] font-semibold transition cursor-pointer"
                      >
                        <span class="w-2.5 h-2.5 rounded-[2px] bg-current mb-0.5"></span>
                        Boya
                      </button>
                      <button
                        type="button"
                        data-mode="check"
                        title="Tik Damgası"
                        class="mode-btn flex flex-col items-center justify-center py-1.5 px-0.5 rounded-lg border border-stone-200 bg-stone-50 text-stone-700 text-[10px] font-semibold transition cursor-pointer"
                      >
                        <span class="text-xs leading-none mb-0.5 font-bold">✓</span>
                        Tik
                      </button>
                      <button
                        type="button"
                        data-mode="star"
                        title="Yıldız Damgası"
                        class="mode-btn flex flex-col items-center justify-center py-1.5 px-0.5 rounded-lg border border-stone-200 bg-stone-50 text-stone-700 text-[10px] font-semibold transition cursor-pointer"
                      >
                        <span class="text-xs leading-none mb-0.5">★</span>
                        Yıldız
                      </button>
                      <button
                        type="button"
                        data-mode="note"
                        title="Gizli Gün Notu Yaz"
                        class="mode-btn flex flex-col items-center justify-center py-1.5 px-0.5 rounded-lg border border-stone-200 bg-stone-50 text-stone-700 text-[10px] font-semibold transition cursor-pointer"
                      >
                        <span class="text-xs leading-none mb-0.5">✎</span>
                        Not
                      </button>
                      <button
                        type="button"
                        data-mode="eraser"
                        title="Boyamayı Sil"
                        class="mode-btn flex flex-col items-center justify-center py-1.5 px-0.5 rounded-lg border border-stone-200 bg-stone-50 text-stone-700 text-[10px] font-semibold transition cursor-pointer"
                      >
                        <span class="text-[10px] leading-none mb-0.5">✕</span>
                        Silgi
                      </button>
                    </div>
                  </div>

                  <!-- Renk Paleti -->
                  <div class="mb-3">
                    <div class="flex items-center justify-between mb-1.5">
                      <span class="text-[11px] font-semibold text-stone-500">Renk Seçeneği</span>
                      <span id="activeColorLabel" class="text-[10px] font-medium text-stone-400">Mercan Kırmızı</span>
                    </div>
                    <div class="grid grid-cols-8 gap-1.5" id="colorPalette">
                      <button type="button" class="color-swatch active" data-color="#f87171" data-label="Mercan Kırmızı" style="background-color: #f87171;" aria-label="Mercan Kırmızı"></button>
                      <button type="button" class="color-swatch" data-color="#fb923c" data-label="Turuncu" style="background-color: #fb923c;" aria-label="Turuncu"></button>
                      <button type="button" class="color-swatch" data-color="#facc15" data-label="Güneş Sarısı" style="background-color: #facc15;" aria-label="Güneş Sarısı"></button>
                      <button type="button" class="color-swatch" data-color="#4ade80" data-label="Nane Yeşili" style="background-color: #4ade80;" aria-label="Nane Yeşili"></button>
                      <button type="button" class="color-swatch" data-color="#38bdf8" data-label="Gök Mavisi" style="background-color: #38bdf8;" aria-label="Gök Mavisi"></button>
                      <button type="button" class="color-swatch" data-color="#a78bfa" data-label="Lavanta Moru" style="background-color: #a78bfa;" aria-label="Lavanta Moru"></button>
                      <button type="button" class="color-swatch" data-color="#f472b6" data-label="Gül Pembesi" style="background-color: #f472b6;" aria-label="Gül Pembesi"></button>
                      <button type="button" class="color-swatch" data-color="#111111" data-label="Damga Siyahı" style="background-color: #111111;" aria-label="Damga Siyahı"></button>
                    </div>
                  </div>

                  <!-- Sürükleyerek Boyama & Sıfırlama -->
                  <div class="flex items-center justify-between py-1.5 px-2 rounded-lg bg-stone-50 mb-2">
                    <span class="text-[11px] font-medium text-stone-700">Sürükleyerek boya</span>
                    <button
                      type="button"
                      id="dragToggle"
                      role="switch"
                      aria-checked="true"
                      class="w-8 h-4.5 rounded-full bg-stone-900 p-0.5 transition flex items-center cursor-pointer"
                    >
                      <span id="dragKnob" class="w-3.5 h-3.5 rounded-full bg-white translate-x-3.5 transition-transform"></span>
                    </button>
                  </div>

                  <button
                    type="button"
                    id="clearAllBtn"
                    class="w-full py-1.5 px-2 rounded-lg border border-red-200 bg-red-50 hover:bg-red-100 text-red-700 text-[11px] font-semibold transition cursor-pointer"
                  >
                    Tümünü Sıfırla
                  </button>
                </div>
              </div>

              <!-- Sağ Üst Kanatları Açık Kuş ve Vurgu Çizgileri -->
              <svg class="w-16 h-16 sm:w-22 sm:h-22 text-[#111111] shrink-0" viewBox="0 0 120 120" fill="none">
                <path d="M84 12 L78 22" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" />
                <path d="M97 16 L90 25" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" />
                <path d="M107 34 L94 42" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" />
                <path d="M112 48 L97 54" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" />
                <path d="M108 64 L96 64" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" />
                <path
                  d="M42 64 C39 50 47 38 59 38 C68 38 74 44 74 52 C74 56 76 58 80 59 C83 60 83 63 79 65 C77 75 68 83 56 83 C47 83 43 75 42 64 Z"
                  fill="#ffffff"
                  stroke="currentColor"
                  stroke-width="3.4"
                  stroke-linejoin="round"
                />
                <circle cx="71" cy="52" r="2.5" fill="currentColor" />
                <path
                  d="M52 44 C47 28 53 12 67 9 C70 8.5 72 11 70 15 C66 23 64 32 65 41"
                  fill="#ffffff"
                  stroke="currentColor"
                  stroke-width="3.3"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
                <path
                  d="M57 62 C65 59 77 62 86 69 C91 73 89 79 82 79 C73 79 64 74 57 66"
                  fill="#ffffff"
                  stroke="currentColor"
                  stroke-width="3.2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
                <path
                  d="M42 66 L30 73 L35 77 L44 73"
                  fill="#ffffff"
                  stroke="currentColor"
                  stroke-width="3.2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </div>
          </div>

          <!-- ORTA KISIM: Geniş Kıvrımlı Şerit (Ribbon Banner) + Çakışmayan Alışkanlık Yazma Alanı -->
          <div class="relative mt-2 sm:mt-2.5 mx-auto w-full max-w-[465px]">
            <svg class="w-full h-auto block text-[#111111] select-none" viewBox="0 0 500 135" fill="none">
              <path
                d="M72 44 L24 34 L38 56 L18 68 L74 79 C155 62 345 62 426 79 L482 68 L462 56 L476 34 L428 44 C345 27 155 27 72 44 Z"
                transform="translate(4, 5)"
                fill="#111111"
              />
              <path
                d="M74 42 L22 31 L36 54 L16 66 L75 78 L84 44 Z"
                fill="#ffffff"
                stroke="currentColor"
                stroke-width="3.5"
                stroke-linejoin="round"
              />
              <path
                d="M426 42 L478 31 L464 54 L484 66 L425 78 L416 44 Z"
                fill="#ffffff"
                stroke="currentColor"
                stroke-width="3.5"
                stroke-linejoin="round"
              />
              <path
                d="M68 36 C158 17 342 17 432 36 L423 94 C340 76 160 76 77 94 Z"
                fill="#ffffff"
                stroke="currentColor"
                stroke-width="3.6"
                stroke-linejoin="round"
              />
              <path d="M74 43 L78 92" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" />
              <path d="M426 43 L422 92" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" />
            </svg>

            <div class="absolute inset-x-0 top-[20%] h-[42%] flex items-center justify-center px-[21%] sm:px-[22%] z-10">
              <input
                id="habitTitleInput"
                type="text"
                maxlength="24"
                placeholder="Alışkanlık adını yazın..."
                aria-label="Takip edilecek alışkanlığın adı"
                class="banner-input text-[20px] sm:text-[27px]"
              />
            </div>

            <!-- Sol Alt Şerit Ucunda Küçük Uçan Kuş -->
            <div class="absolute -bottom-6 -left-2 sm:-left-3 w-14 h-14 sm:w-16 sm:h-16 pointer-events-none z-10">
              <svg class="w-full h-full text-[#111111]" viewBox="0 0 90 90" fill="none">
                <path
                  d="M28 52 C27 42 35 35 45 36 C52 37 56 42 56 47 L65 49 C67 50 66 53 63 54 C61 61 54 66 45 65 C35 64 29 59 28 52 Z"
                  fill="#ffffff"
                  stroke="currentColor"
                  stroke-width="3.2"
                  stroke-linejoin="round"
                />
                <circle cx="55" cy="46" r="2.2" fill="currentColor" />
                <path
                  d="M41 47 C36 37 26 34 17 38 C14 39.5 15 43 19 43.5 C26 44.5 32 47 37 51"
                  fill="#ffffff"
                  stroke="currentColor"
                  stroke-width="3.1"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
                <path
                  d="M29 55 L18 62 L22 65 L31 59"
                  fill="#ffffff"
                  stroke="currentColor"
                  stroke-width="3"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </div>
          </div>

          <!-- ŞERİDİN HEMEN ALTINDA: Kaligrafik "habit tracker" Başlığı -->
          <div class="text-center mt-2 sm:mt-2.5 mb-2 select-none">
            <h1 class="font-script text-[#111111] text-[32px] sm:text-[42px] leading-tight tracking-normal">
              habit tracker
            </h1>
            <!-- Ay & Yıl Seçici (2026 - 2050, Varsayılan: Güncel Tarih) -->
            <div class="no-print mt-1 inline-flex items-center justify-center gap-1.5 px-2.5 py-1 rounded-full bg-stone-50 border border-stone-200">
              <select
                id="monthSelect"
                aria-label="Ay seçimi"

  <!-- GİZLİ GÜN NOTU POP-UP (MODAL) -->
  <div id="noteModal" class="modal-backdrop no-print" role="dialog" aria-modal="true" aria-labelledby="noteModalTitle">

          <button
            type="button"
            id="cancelNoteBtn"
            class="px-3 py-1.5 rounded-xl border border-stone-200 bg-white hover:bg-stone-50 text-stone-700 text-xs font-semibold transition cursor-pointer"
          >
            Vazgeç
          </button>
          <button
            type="button"
            id="saveNoteBtn"
            class="px-4 py-1.5 rounded-xl bg-[#111111] hover:bg-stone-800 text-white text-xs font-semibold transition cursor-pointer"
          >
            Kaydet

  <script>
    (function () {
      const STORAGE_PREFIX = 'midori_habit_tracker_stamp_v2';
      const TOTAL_CELLS = 35; // 7 sütun x 5 satır
      const MIN_YEAR = 2026;
      const MAX_YEAR = 2050;
      const TURKISH_WEEKDAYS = ['Paz', 'Pzt', 'Sal', 'Çar', 'Per', 'Cum', 'Cmt'];
      const TURKISH_MONTHS = [
        'Ocak', 'Şubat', 'Mart', 'Nisan', 'Mayıs', 'Haziran',
        'Temmuz', 'Ağustos', 'Eylül', 'Ekim', 'Kasım', 'Aralık'
      ];

      // Firebase Realtime Database yapılandırması (reminder-h)
      const firebaseConfig = {
        apiKey: "AIzaSyCU_DwhRBH-Bj3uPN-HxGHQVvjPhU2lZqA",
        authDomain: "reminder-h.firebaseapp.com",
        databaseURL: "https://reminder-h-default-rtdb.firebaseio.com",
        projectId: "reminder-h",
        storageBucket: "reminder-h.firebasestorage.app",
        messagingSenderId: "671067961267",
        appId: "1:671067961267:web:1897d9c507134dd945bdc6"
      };

      function getCurrentClampedDate(refDate = new Date()) {
        return {
          year: Math.min(MAX_YEAR, Math.max(MIN_YEAR, refDate.getFullYear())),
          month: refDate.getMonth(),
          day: refDate.getDate()
        };
      }

      const initialDate = getCurrentClampedDate();
      let observedDateKey = `${initialDate.year}-${initialDate.month}-${initialDate.day}`;
      let midnightTimeoutId = null;

      let db = null;
      let trackerCloudRef = null;
      let isApplyingRemoteState = false;
      const cloudSyncDotEl = document.getElementById('cloudSyncDot');

      // Uygulama durumu
      const state = {
        year: initialDate.year,
        month: initialDate.month,
        habitName: '',
        color: '#f87171',
        colorLabel: 'Mercan Kırmızı',
        mode: 'fill', // 'fill' | 'check' | 'star' | 'note' | 'eraser'
        dragPaint: true,
        selectedCell: null,
        cells: {}, // hücre indeksi (0..34) -> { mode: 'fill'|'check'|'star', color: '#...' }
        notes: {}  // hücre indeksi (0..34) -> 'gizli not metni'
      };

      let isPointerDown = false;
      let lastPaintedIndex = null;
      let activeNoteCellIndex = null;

      // DOM referansları
      const gridEl = document.getElementById('trackerGrid');
      const habitInputEl = document.getElementById('habitTitleInput');
      const monthSelectEl = document.getElementById('monthSelect');
      const yearSelectEl = document.getElementById('yearSelect');
      const progressCountMiniEl = document.getElementById('progressCountMini');
      const progressPercentEl = document.getElementById('progressPercent');
      const currentModeBadgeColorEl = document.getElementById('currentModeBadgeColor');
      const percentMenuBtn = document.getElementById('percentMenuBtn');
      const percentPopover = document.getElementById('percentPopover');
      const activeModeSummaryEl = document.getElementById('activeModeSummary');
      const activeColorLabelEl = document.getElementById('activeColorLabel');
      const dragToggleEl = document.getElementById('dragToggle');
      const dragKnobEl = document.getElementById('dragKnob');
      const clearAllBtn = document.getElementById('clearAllBtn');
      const printBtn = document.getElementById('printBtn');
      const downloadPngBtn = document.getElementById('downloadPngBtn');
      const statusToastEl = document.getElementById('statusToast');

      // Not modal elemanları
      const noteModalEl = document.getElementById('noteModal');
      const noteModalTitleEl = document.getElementById('noteModalTitle');
      const noteTextareaEl = document.getElementById('noteTextarea');
      const saveNoteBtn = document.getElementById('saveNoteBtn');
      const deleteNoteBtn = document.getElementById('deleteNoteBtn');
      const cancelNoteBtn = document.getElementById('cancelNoteBtn');
      const closeNoteModalBtn = document.getElementById('closeNoteModalBtn');

      function getDaysInMonth(year, month) {
        return new Date(year, month + 1, 0).getDate();
      }

      function getWeekdayLabel(year, month, day) {
        const d = new Date(year, month, day);
        return TURKISH_WEEKDAYS[d.getDay()];
      }

      function getDateStorageKey(year, month) {
        const mm = String(month + 1).padStart(2, '0');
        return `${STORAGE_PREFIX}_${year}_${mm}`;
      }

      function getDateBoardId(year, month) {
        const mm = String(month + 1).padStart(2, '0');
        return `default_stamp_${year}_${mm}`;
      }

      function populateYearSelect() {
        yearSelectEl.innerHTML = '';
        for (let y = MIN_YEAR; y <= MAX_YEAR; y++) {
          const opt = document.createElement('option');
          opt.value = String(y);
          opt.textContent = String(y);
          yearSelectEl.appendChild(opt);
        }
      }

      function setCloudStatus(status) {
        if (!cloudSyncDotEl) return;
        if (status === 'connected') {
          cloudSyncDotEl.className = 'w-1.5 h-1.5 rounded-full bg-emerald-500';
          cloudSyncDotEl.title = 'Firebase Bulut Bağlı';
        } else if (status === 'syncing') {
          cloudSyncDotEl.className = 'w-1.5 h-1.5 rounded-full bg-amber-400 animate-pulse';
          cloudSyncDotEl.title = 'Firebase Senkronize Ediliyor...';
        } else {
          cloudSyncDotEl.className = 'w-1.5 h-1.5 rounded-full bg-stone-300';
          cloudSyncDotEl.title = 'Yerel Mod';
        }
      }

      function showToast(message) {
        statusToastEl.textContent = message;
        statusToastEl.classList.remove('hidden');
        clearTimeout(showToast._timer);
        showToast._timer = setTimeout(() => {
          statusToastEl.classList.add('hidden');
        }, 2000);
      }

      function paintCurrentDayCell(currentDate = getCurrentClampedDate()) {
        const daysInMonth = getDaysInMonth(state.year, state.month);
        if (
          state.year !== currentDate.year ||
          state.month !== currentDate.month ||
          currentDate.day < 1 ||
          currentDate.day > daysInMonth
        ) {
          return false;
        }

        const todayIndex = currentDate.day - 1;
        const paintMode = ['fill', 'check', 'star'].includes(state.mode) ? state.mode : 'fill';
        const existing = state.cells[todayIndex];

        if (
          existing &&
          existing.mode === paintMode &&
          existing.color &&
          existing.color.toLowerCase() === state.color.toLowerCase()
        ) {
          return false;
        }

        state.cells[todayIndex] = {
          mode: paintMode,
          color: state.color
        };
        return true;
      }

      function loadState() {
        state.cells = {};
        state.notes = {};
        state.selectedCell = null;

        try {
          const globalRaw = localStorage.getItem(STORAGE_PREFIX);
          if (globalRaw) {
            const globalParsed = JSON.parse(globalRaw);
            if (typeof globalParsed.habitName === 'string') state.habitName = globalParsed.habitName;
            if (typeof globalParsed.color === 'string') state.color = globalParsed.color;
            if (typeof globalParsed.colorLabel === 'string') state.colorLabel = globalParsed.colorLabel;
            if (['fill', 'check', 'star', 'note', 'eraser'].includes(globalParsed.mode)) {
              state.mode = globalParsed.mode;
            }
            if (typeof globalParsed.dragPaint === 'boolean') state.dragPaint = globalParsed.dragPaint;
          }

          const monthRaw = localStorage.getItem(getDateStorageKey(state.year, state.month));
          if (monthRaw) {
            const monthParsed = JSON.parse(monthRaw);
            if (typeof monthParsed.habitName === 'string') state.habitName = monthParsed.habitName;
            if (typeof monthParsed.selectedCell === 'number') state.selectedCell = monthParsed.selectedCell;
            if (monthParsed.cells && typeof monthParsed.cells === 'object') state.cells = monthParsed.cells;
            if (monthParsed.notes && typeof monthParsed.notes === 'object') state.notes = monthParsed.notes;
          }
        } catch (err) {
          console.warn('Yerel kayıt yüklenemedi:', err);
        }

        paintCurrentDayCell();
      }

      function pushStateToFirebase() {
        if (!trackerCloudRef || isApplyingRemoteState) return;
        try {
          setCloudStatus('syncing');
          trackerCloudRef.set(
            {
              year: state.year,
              month: state.month + 1,
              habitName: state.habitName,
              cells: state.cells,
              notes: state.notes,
              updatedAt: Date.now()
            },
            (err) => {
              setCloudStatus(err ? 'offline' : 'connected');
            }
          );
        } catch (err) {
          console.warn('Firebase yazma hatası:', err);
          setCloudStatus('offline');
        }
      }

      function saveState() {
        try {
          localStorage.setItem(
            STORAGE_PREFIX,
            JSON.stringify({
              habitName: state.habitName,
              color: state.color,
              colorLabel: state.colorLabel,
              mode: state.mode,
              dragPaint: state.dragPaint
            })
          );
          localStorage.setItem(
            getDateStorageKey(state.year, state.month),
            JSON.stringify({
              habitName: state.habitName,
              selectedCell: state.selectedCell,
              cells: state.cells,
              notes: state.notes
            })
          );
        } catch (err) {
          console.warn('Yerel kayıt yapılamadı:', err);
        }
        pushStateToFirebase();
      }

      function bindFirebaseMonthListener() {
        if (!db) return;
        if (trackerCloudRef) {
          trackerCloudRef.off();
        }
        const boardId = getDateBoardId(state.year, state.month);
        trackerCloudRef = db.ref(`habit_trackers/${boardId}`);

        trackerCloudRef.on('value', (snap) => {
          const remoteData = snap.val();
          if (!remoteData || typeof remoteData !== 'object') return;

          isApplyingRemoteState = true;
          if (typeof remoteData.habitName === 'string') {
            state.habitName = remoteData.habitName;
            if (habitInputEl && habitInputEl.value !== state.habitName) {
              habitInputEl.value = state.habitName;
            }
          }
          state.cells = remoteData.cells && typeof remoteData.cells === 'object' ? remoteData.cells : {};
          state.notes = remoteData.notes && typeof remoteData.notes === 'object' ? remoteData.notes : {};
          paintCurrentDayCell();

          try {
            localStorage.setItem(
              getDateStorageKey(state.year, state.month),
              JSON.stringify({
                habitName: state.habitName,
                selectedCell: state.selectedCell,
                cells: state.cells,
                notes: state.notes
              })
            );
          } catch (_) {}

          for (let i = 0; i < TOTAL_CELLS; i++) {
            renderCell(i);
          }
          updateProgress();
          isApplyingRemoteState = false;
        });
      }

      function initFirebaseSync() {
        try {
          if (!window.firebase) {
            setCloudStatus('offline');
            return;
          }
          if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
          }
          db = firebase.database();

          db.ref('.info/connected').on('value', (snap) => {
            setCloudStatus(snap.val() === true ? 'connected' : 'offline');
          });

          bindFirebaseMonthListener();
        } catch (err) {
          console.warn('Firebase başlatılamadı:', err);
          setCloudStatus('offline');
        }
      }

      function switchToMonthYear(nextYear, nextMonth, reasonLabel = '') {
        state.year = nextYear;
        state.month = nextMonth;
        monthSelectEl.value = String(state.month);
        yearSelectEl.value = String(state.year);

        loadState();
        habitInputEl.value = state.habitName;
        buildGrid();
        updateProgress();
        bindFirebaseMonthListener();
        saveState();

        if (reasonLabel) {
          showToast(`${reasonLabel}: ${TURKISH_MONTHS[state.month]} ${state.year}`);
        }
      }

      function syncCurrentDateIfChanged(triggerSource = '') {
        const current = getCurrentClampedDate(new Date());
        const nextDateKey = `${current.year}-${current.month}-${current.day}`;
        const dayChanged = nextDateKey !== observedDateKey;
        const monthOrYearMismatch = state.year !== current.year || state.month !== current.month;

        if (dayChanged) {
          observedDateKey = nextDateKey;
        }

        if (monthOrYearMismatch) {
          switchToMonthYear(current.year, current.month, triggerSource);
        } else if (dayChanged) {
          const paintedToday = paintCurrentDayCell(current);
          buildGrid();
          updateProgress();
          if (paintedToday) {
            saveState();
          }
          if (triggerSource) {
            showToast(`${triggerSource}: ${current.day} ${TURKISH_MONTHS[current.month]} ${current.year}`);
          }
        } else if (paintCurrentDayCell(current)) {
          for (let i = 0; i < TOTAL_CELLS; i++) {
            renderCell(i);
          }
          updateProgress();
          saveState();
        }

        scheduleNextMidnightCheck();
      }

      function scheduleNextMidnightCheck() {
        if (midnightTimeoutId) {
          clearTimeout(midnightTimeoutId);
          midnightTimeoutId = null;
        }

        const now = new Date();
        const nextMidnight = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 1, 0);
        const msUntilMidnight = Math.max(1000, nextMidnight.getTime() - now.getTime());

        midnightTimeoutId = setTimeout(() => {
          syncCurrentDateIfChanged('Gece yarısı güncellendi');
        }, msUntilMidnight);
      }

      function initAutomaticDateSync() {
        scheduleNextMidnightCheck();

        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'visible') {
            syncCurrentDateIfChanged('Güncel tarihe dönüldü');
          }
        });

        window.addEventListener('pageshow', () => {
          syncCurrentDateIfChanged('Güncel tarihe dönüldü');
        });

        window.addEventListener('focus', () => {
          syncCurrentDateIfChanged('Güncel tarihe dönüldü');
        });

        // Cihaz uykudan uyandığında setTimeout gecikmelerini yakalamak için periyodik emniyet kontrolü
        setInterval(() => {
          if (document.visibilityState === 'visible') {
            syncCurrentDateIfChanged('Gece yarısı güncellendi');
          }
        }, 30000);
      }

      function updateProgress() {
        const daysInMonth = getDaysInMonth(state.year, state.month);
        let markedDays = 0;
        for (let i = 0; i < daysInMonth; i++) {
          if (state.cells[i]) markedDays++;
        }
        const pct = Math.round((markedDays / daysInMonth) * 100);
        progressPercentEl.textContent = `${pct}%`;
        progressCountMiniEl.textContent = `${markedDays}/${daysInMonth}`;
        currentModeBadgeColorEl.style.backgroundColor = state.color;
      }

      function openNoteModal(index) {
        const daysInMonth = getDaysInMonth(state.year, state.month);
        activeNoteCellIndex = index;
        state.selectedCell = index;
        saveState();

        for (let i = 0; i < TOTAL_CELLS; i++) {
          renderCell(i);
        }

        const monthTitle = TURKISH_MONTHS[state.month];
        const label =
          index < daysInMonth
            ? `${index + 1} ${monthTitle} ${state.year} (${getWeekdayLabel(state.year, state.month, index + 1)})`
            : `Ek Kutu ${index - daysInMonth + 1}`;
        noteModalTitleEl.textContent = label;
        noteTextareaEl.value = state.notes[index] || '';
        deleteNoteBtn.style.visibility = state.notes[index] ? 'visible' : 'hidden';

        noteModalEl.classList.add('open');
        setTimeout(() => noteTextareaEl.focus(), 60);
      }

      function closeNoteModal() {
        noteModalEl.classList.remove('open');
        activeNoteCellIndex = null;
      }

      function createMarkSvg(mode, color) {
        const isDark = color.toLowerCase() === '#111111';
        const strokeColor = isDark ? '#ffffff' : '#111111';

        if (mode === 'check') {
          return `
            <svg class="w-3/5 h-3/5" viewBox="0 0 36 36" fill="none">
              <path
                d="M7.5 19.5 L14.5 26.5 L28.5 10.5"
                stroke="${strokeColor}"
                stroke-width="4.2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          `;
        }

        if (mode === 'star') {
          return `
            <svg class="w-3/5 h-3/5" viewBox="0 0 36 36" fill="none">
              <path
                d="M18 5 L21.6 13.2 L30.5 14 L23.8 19.8 L25.9 28.5 L18 23.8 L10.1 28.5 L12.2 19.8 L5.5 14 L14.4 13.2 Z"
                fill="${strokeColor}"
                stroke="${strokeColor}"
                stroke-width="1.8"
                stroke-linejoin="round"
              />
            </svg>
          `;
        }

        return '';
      }

      function renderCell(index) {
        const cellEl = gridEl.querySelector(`[data-index="${index}"]`);
        if (!cellEl) return;

        const fillEl = cellEl.querySelector('.cell-fill');
        const markEl = cellEl.querySelector('.cell-mark');
        const numberEl = cellEl.querySelector('.cell-number');
        const dayNameEl = cellEl.querySelector('.cell-day-name');
        const badgeEl = cellEl.querySelector('.note-badge');
        const cellData = state.cells[index];
        const hasNote = Boolean(state.notes[index] && state.notes[index].trim().length > 0);

        cellEl.classList.remove('painted', 'selected-day');
        if (state.selectedCell === index) {
          cellEl.classList.add('selected-day');
        }

        fillEl.style.backgroundColor = 'transparent';
        fillEl.style.opacity = '0';
        markEl.innerHTML = '';

        if (badgeEl) {
          badgeEl.classList.toggle('hidden', !hasNote);
        }

        if (numberEl) {
          numberEl.style.color = '#111111';
          numberEl.style.opacity = '1';
        }
        if (dayNameEl) {
          dayNameEl.style.color = '#57534e';
          dayNameEl.style.opacity = '0.85';
        }

        if (!cellData) return;

        const { mode, color } = cellData;

        if (mode === 'fill') {
          cellEl.classList.add('painted');
          fillEl.style.backgroundColor = color;
          fillEl.style.opacity = '0.88';
          if (color.toLowerCase() === '#111111') {
            if (numberEl) numberEl.style.color = '#ffffff';
            if (dayNameEl) {
              dayNameEl.style.color = '#e7e5e4';
              dayNameEl.style.opacity = '0.9';
            }
          }
        } else if (mode === 'check' || mode === 'star') {
          cellEl.classList.add('painted');
          fillEl.style.backgroundColor = color;
          fillEl.style.opacity = '0.24';
          if (numberEl) {
            numberEl.style.opacity = '0.42';
          }
          if (dayNameEl) {
            dayNameEl.style.opacity = '0.5';
          }
          markEl.innerHTML = createMarkSvg(mode, color);
        }
      }

      function applyToolToCell(index, allowToggleOff = true) {
        if (index < 0 || index >= TOTAL_CELLS) return;

        state.selectedCell = index;
        const hasNote = Boolean(state.notes[index] && state.notes[index].trim().length > 0);

        if (state.mode === 'note') {
          openNoteModal(index);
          return;
        }

        const existing = state.cells[index];

        if (state.mode === 'eraser') {
          if (existing) {
            delete state.cells[index];
            renderCell(index);
            updateProgress();
            saveState();
          }
          return;
        }

        if (
          allowToggleOff &&
          existing &&
          existing.mode === state.mode &&
          existing.color === state.color
        ) {
          delete state.cells[index];
        } else {
          state.cells[index] = {
            mode: state.mode,
            color: state.color
          };
        }

        renderCell(index);
        updateProgress();
        saveState();

        if (allowToggleOff && hasNote) {
          openNoteModal(index);
        }
      }

      function buildGrid() {
        gridEl.innerHTML = '';
        const daysInMonth = getDaysInMonth(state.year, state.month);

        for (let i = 0; i < TOTAL_CELLS; i++) {
          const row = Math.floor(i / 7);
          const col = i % 7;
          const dayNumber = i < daysInMonth ? i + 1 : null;
          const weekdayLabel = dayNumber !== null ? getWeekdayLabel(state.year, state.month, dayNumber) : null;

          const cell = document.createElement('div');
          cell.className = 'grid-cell';
          cell.dataset.index = String(i);
          cell.setAttribute('role', 'button');
          cell.setAttribute(
            'aria-label',
            dayNumber !== null
              ? `${dayNumber} ${TURKISH_MONTHS[state.month]} ${state.year} ${weekdayLabel}`
              : `Boş kutu ${i - daysInMonth + 1}`
          );

          if (col < 6) {
            cell.style.borderRight = '2.4px solid #111111';
          }
          if (row < 4) {
            cell.style.borderBottom = '2.4px solid #111111';
          }

          const fillDiv = document.createElement('div');
          fillDiv.className = 'cell-fill';
          cell.appendChild(fillDiv);

          if (dayNumber !== null) {
            const contentStack = document.createElement('div');
            contentStack.className = 'flex flex-col items-center justify-center leading-none z-[3] pointer-events-none gap-0.5';

            const numSpan = document.createElement('span');
            numSpan.className = 'cell-number text-[19px] sm:text-[24px]';
            numSpan.textContent = String(dayNumber);

            const daySpan = document.createElement('span');
            daySpan.className = 'cell-day-name';
            daySpan.textContent = weekdayLabel;

            contentStack.appendChild(numSpan);
            contentStack.appendChild(daySpan);
            cell.appendChild(contentStack);
          }

          const markDiv = document.createElement('div');
          markDiv.className = 'cell-mark';
          cell.appendChild(markDiv);

          const badgeSpan = document.createElement('span');
          badgeSpan.className = 'note-badge hidden';
          badgeSpan.title = 'Gizli not var';
          cell.appendChild(badgeSpan);

          cell.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            if (!percentPopover.classList.contains('hidden-pop')) {
              togglePopover(false);
            }
            isPointerDown = true;
            lastPaintedIndex = i;
            applyToolToCell(i, true);
          });

          cell.addEventListener('pointerenter', () => {
            if (!isPointerDown || !state.dragPaint || state.mode === 'note') return;
            if (lastPaintedIndex === i) return;
            lastPaintedIndex = i;
            applyToolToCell(i, false);
          });

          gridEl.appendChild(cell);
          renderCell(i);
        }
      }

      function handleDateSelectionChange() {
        switchToMonthYear(Number(yearSelectEl.value), Number(monthSelectEl.value));
      }

      function togglePopover(forceState) {
        const isCurrentlyHidden = percentPopover.classList.contains('hidden-pop');
        const nextOpen = typeof forceState === 'boolean' ? forceState : isCurrentlyHidden;
        percentPopover.classList.toggle('hidden-pop', !nextOpen);
        percentMenuBtn.setAttribute('aria-expanded', String(nextOpen));
      }

      function bindToolbar() {
        populateYearSelect();
        monthSelectEl.value = String(state.month);
        yearSelectEl.value = String(state.year);

        monthSelectEl.addEventListener('change', handleDateSelectionChange);
        yearSelectEl.addEventListener('change', handleDateSelectionChange);

        percentMenuBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          togglePopover();
        });

        percentPopover.addEventListener('click', (e) => {
          e.stopPropagation();
        });

        document.addEventListener('click', () => {
          if (!percentPopover.classList.contains('hidden-pop')) {
            togglePopover(false);
          }
        });

        habitInputEl.value = state.habitName;
        habitInputEl.addEventListener('input', (e) => {
          state.habitName = e.target.value;
          saveState();
        });

        const swatches = document.querySelectorAll('.color-swatch');
        swatches.forEach((swatch) => {
          const swatchColor = swatch.dataset.color;
          if (swatchColor.toLowerCase() === state.color.toLowerCase()) {
            swatch.classList.add('active');
            activeColorLabelEl.textContent = swatch.dataset.label || state.colorLabel;
          } else {
            swatch.classList.remove('active');
          }

          swatch.addEventListener('click', () => {
            swatches.forEach((s) => s.classList.remove('active'));
            swatch.classList.add('active');
            state.color = swatch.dataset.color;
            state.colorLabel = swatch.dataset.label || '';
            activeColorLabelEl.textContent = state.colorLabel;
            currentModeBadgeColorEl.style.backgroundColor = state.color;

            if (state.mode === 'eraser' || state.mode === 'note') {
              setMode('fill');
            }
            saveState();
          });
        });

        const modeLabels = {
          fill: 'Boya',
          check: 'Tik Damgası',
          star: 'Yıldız Damgası',
          note: 'Gizli Not',
          eraser: 'Silgi'
        };

        const modeButtons = document.querySelectorAll('.mode-btn');
        function setMode(newMode) {
          state.mode = newMode;
          activeModeSummaryEl.textContent = modeLabels[newMode] || 'Boya';

          modeButtons.forEach((btn) => {
            const isSelected = btn.dataset.mode === newMode;
            btn.classList.toggle('active', isSelected);
            if (isSelected) {
              btn.classList.remove('border-stone-200', 'bg-stone-50', 'text-stone-700');
              btn.classList.add('border-[#111111]', 'bg-[#111111]', 'text-white');
            } else {
              btn.classList.remove('border-[#111111]', 'bg-[#111111]', 'text-white');
              btn.classList.add('border-stone-200', 'bg-stone-50', 'text-stone-700');
            }
          });
          saveState();

          if (newMode === 'note') {
            togglePopover(false);
            const targetIdx = typeof state.selectedCell === 'number' ? state.selectedCell : 0;
            openNoteModal(targetIdx);
          }
        }

        modeButtons.forEach((btn) => {
          btn.addEventListener('click', () => setMode(btn.dataset.mode));
        });
        setMode(state.mode);

        function syncDragToggle() {
          dragToggleEl.setAttribute('aria-checked', String(state.dragPaint));
          if (state.dragPaint) {
            dragToggleEl.classList.remove('bg-stone-300');
            dragToggleEl.classList.add('bg-[#111111]');
            dragKnobEl.classList.add('translate-x-3.5');
            dragKnobEl.classList.remove('translate-x-0');
          } else {
            dragToggleEl.classList.remove('bg-[#111111]');
            dragToggleEl.classList.add('bg-stone-300');
            dragKnobEl.classList.remove('translate-x-3.5');
            dragKnobEl.classList.add('translate-x-0');
          }
        }

        dragToggleEl.addEventListener('click', () => {
          state.dragPaint = !state.dragPaint;
          syncDragToggle();
          saveState();
        });
        syncDragToggle();

        clearAllBtn.addEventListener('click', () => {
          const hasAny =
            Object.keys(state.cells).length > 0 || Object.keys(state.notes).length > 0;
          if (!hasAny) {
            showToast('Zaten temiz durumda.');
            return;
          }
          state.cells = {};
          state.notes = {};
          state.selectedCell = null;
          for (let i = 0; i < TOTAL_CELLS; i++) {
            renderCell(i);
          }
          updateProgress();
          saveState();
          togglePopover(false);
          showToast('Tüm boyamalar ve notlar sıfırlandı.');
        });

        saveNoteBtn.addEventListener('click', () => {
          if (activeNoteCellIndex === null) return;
          const trimmed = noteTextareaEl.value.trim();
          if (trimmed) {
            state.notes[activeNoteCellIndex] = trimmed;
            showToast('Gizli not kaydedildi.');
          } else {
            delete state.notes[activeNoteCellIndex];
          }
          renderCell(activeNoteCellIndex);
          saveState();
          closeNoteModal();
        });

        deleteNoteBtn.addEventListener('click', () => {
          if (activeNoteCellIndex === null) return;
          delete state.notes[activeNoteCellIndex];
          renderCell(activeNoteCellIndex);
          saveState();
          closeNoteModal();
          showToast('Gizli not silindi.');
        });

        cancelNoteBtn.addEventListener('click', closeNoteModal);
        closeNoteModalBtn.addEventListener('click', closeNoteModal);

        noteModalEl.addEventListener('click', (e) => {
          if (e.target === noteModalEl) {
            closeNoteModal();
          }
        });

        document.addEventListener('keydown', (e) => {
          if (e.key === 'Escape' && noteModalEl.classList.contains('open')) {
            closeNoteModal();
          }
        });

        printBtn.addEventListener('click', () => {
          window.print();
        });

        downloadPngBtn.addEventListener('click', async () => {
          try {
            if (document.fonts && document.fonts.ready) {
              await document.fonts.ready;
            }
            exportStampAsPng();
            showToast('PNG damga görseli indirildi.');
          } catch (err) {
            console.error(err);
            showToast('PNG oluşturulurken bir sorun oluştu.');
          }
        });

        window.addEventListener('pointerup', () => {
          isPointerDown = false;
          lastPaintedIndex = null;
        });
      }

      function drawStarCanvas(ctx, cx, cy, spikes, outerR, innerR, fillStyle, strokeStyle, lineWidth = 3) {
        let rot = (Math.PI / 2) * 3;
        const step = Math.PI / spikes;

        ctx.beginPath();
        ctx.moveTo(cx, cy - outerR);
        for (let i = 0; i < spikes; i++) {
          ctx.lineTo(cx + Math.cos(rot) * outerR, cy + Math.sin(rot) * outerR);
          rot += step;
          ctx.lineTo(cx + Math.cos(rot) * innerR, cy + Math.sin(rot) * innerR);
          rot += step;
        }
        ctx.closePath();

        if (fillStyle) {
          ctx.fillStyle = fillStyle;
          ctx.fill();
        }
        if (strokeStyle) {
          ctx.strokeStyle = strokeStyle;
          ctx.lineWidth = lineWidth;
          ctx.lineJoin = 'round';
          ctx.stroke();
        }
      }

      function exportStampAsPng() {
        const W = 1080;
        const H = 1280;
        const canvas = document.createElement('canvas');
        canvas.width = W;
        canvas.height = H;
        const ctx = canvas.getContext('2d');

        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, W, H);

        ctx.strokeStyle = '#111111';
        ctx.fillStyle = '#111111';

        ctx.lineCap = 'round';
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.moveTo(118, 82);
        ctx.lineTo(132, 106);
        ctx.moveTo(100, 108);
        ctx.lineTo(120, 122);
        ctx.moveTo(142, 76);
        ctx.lineTo(150, 98);
        ctx.stroke();
        drawStarCanvas(ctx, 185, 118, 5, 32, 14, '#ffffff', '#111111', 6);

        ctx.font = '700 68px "Caveat", cursive';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText("\\ Let's try it /", W / 2, 106);

        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.moveTo(855, 62);
        ctx.lineTo(842, 86);
        ctx.moveTo(886, 72);
        ctx.lineTo(870, 94);
        ctx.moveTo(912, 106);
        ctx.lineTo(884, 124);
        ctx.moveTo(924, 138);
        ctx.lineTo(890, 152);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(785, 165);
        ctx.bezierCurveTo(780, 132, 800, 106, 828, 106);
        ctx.bezierCurveTo(848, 106, 862, 120, 862, 138);
        ctx.bezierCurveTo(862, 146, 868, 152, 876, 154);
        ctx.bezierCurveTo(882, 156, 882, 164, 873, 168);
        ctx.bezierCurveTo(868, 192, 848, 208, 820, 208);
        ctx.bezierCurveTo(798, 208, 788, 190, 785, 165);
        ctx.closePath();
        ctx.fillStyle = '#ffffff';
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(854, 138, 5, 0, Math.PI * 2);
        ctx.fillStyle = '#111111';
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(812, 120);
        ctx.bezierCurveTo(800, 82, 814, 48, 846, 40);
        ctx.bezierCurveTo(854, 39, 858, 45, 854, 54);
        ctx.bezierCurveTo(844, 72, 840, 92, 842, 114);
        ctx.closePath();
        ctx.fillStyle = '#ffffff';
        ctx.fill();
        ctx.stroke();

        const bx = 140;
        const by = 215;
        const bw = 800;
        const bh = 135;

        ctx.beginPath();
        ctx.moveTo(bx + 115, by + 35);
        ctx.quadraticCurveTo(bx + bw / 2, by - 8, bx + bw - 115, by + 35);
        ctx.lineTo(bx + bw - 130, by + bh);
        ctx.quadraticCurveTo(bx + bw / 2, by + bh - 42, bx + 130, by + bh);
        ctx.closePath();
        ctx.fillStyle = '#111111';
        ctx.fill();
        ctx.save();
        ctx.translate(8, 10);
        ctx.fill();
        ctx.restore();

        ctx.fillStyle = '#ffffff';
        ctx.lineWidth = 7;
        ctx.beginPath();
        ctx.moveTo(bx + 122, by + 38);
        ctx.lineTo(bx + 12, by + 16);
        ctx.lineTo(bx + 42, by + 66);
        ctx.lineTo(bx + 4, by + 92);
        ctx.lineTo(bx + 125, by + 118);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(bx + bw - 122, by + 38);
        ctx.lineTo(bx + bw - 12, by + 16);
        ctx.lineTo(bx + bw - 42, by + 66);
        ctx.lineTo(bx + bw - 4, by + 92);
        ctx.lineTo(bx + bw - 125, by + 118);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(bx + 112, by + 26);
        ctx.quadraticCurveTo(bx + bw / 2, by - 16, bx + bw - 112, by + 26);
        ctx.lineTo(bx + bw - 128, by + bh);
        ctx.quadraticCurveTo(bx + bw / 2, by + bh - 44, bx + 128, by + bh);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        const bannerText = (state.habitName || '').trim();
        if (bannerText) {
          ctx.font = '700 62px "Caveat", cursive';
          ctx.fillStyle = '#111111';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(bannerText, W / 2, by + 68);
        }

        ctx.font = '86px "Pacifico", cursive';
        ctx.fillStyle = '#111111';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('habit tracker', W / 2, 412);

        ctx.font = '600 28px "Inter", sans-serif';
        ctx.fillStyle = '#57534e';
        ctx.fillText(`${TURKISH_MONTHS[state.month]} ${state.year}`, W / 2, 456);

        ctx.font = '700 56px "Caveat", cursive';
        ctx.fillStyle = '#111111';
        ctx.save();
        ctx.translate(64, 580);
        ctx.rotate(-Math.PI / 2);
        ctx.fillText('\\ good /', 0, 0);
        ctx.restore();

        drawStarCanvas(ctx, 64, 980, 5, 34, 15, '#ffffff', '#111111', 6);
        drawStarCanvas(ctx, 64, 1055, 5, 22, 10, '#111111', '#111111', 4);

        drawStarCanvas(ctx, W - 64, 550, 5, 34, 15, '#ffffff', '#111111', 6);
        drawStarCanvas(ctx, W - 64, 625, 5, 22, 10, '#111111', '#111111', 4);

        ctx.save();
        ctx.translate(W - 64, 960);
        ctx.rotate(Math.PI / 2);
        ctx.fillText('\\ nice /', 0, 0);
        ctx.restore();

        const gx = 120;
        const gy = 480;
        const gw = W - 240;
        const gh = 720;
        const cols = 7;
        const rows = 5;
        const cw = gw / cols;
        const ch = gh / rows;
        const daysInMonth = getDaysInMonth(state.year, state.month);

        ctx.fillStyle = '#111111';
        ctx.fillRect(gx + 7, gy + 8, gw, gh);

        ctx.fillStyle = '#ffffff';
        ctx.fillRect(gx, gy, gw, gh);

        for (let i = 0; i < TOTAL_CELLS; i++) {
          const r = Math.floor(i / cols);
          const c = i % cols;
          const x = gx + c * cw;
          const y = gy + r * ch;
          const cellData = state.cells[i];

          if (cellData) {
            ctx.save();
            if (cellData.mode === 'fill') {
              ctx.globalAlpha = 0.88;
              ctx.fillStyle = cellData.color;
              ctx.fillRect(x + 4, y + 4, cw - 8, ch - 8);
            } else if (cellData.mode === 'check' || cellData.mode === 'star') {
              ctx.globalAlpha = 0.24;
              ctx.fillStyle = cellData.color;
              ctx.fillRect(x + 4, y + 4, cw - 8, ch - 8);
            }
            ctx.restore();
          }

          if (i < daysInMonth) {
            const dayNum = i + 1;
            const wkLabel = getWeekdayLabel(state.year, state.month, dayNum);
            const isDarkFill = cellData && cellData.mode === 'fill' && cellData.color.toLowerCase() === '#111111';
            const isStamped = cellData && (cellData.mode === 'check' || cellData.mode === 'star');

            ctx.save();
            ctx.font = '600 44px "Caveat", cursive';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            if (isDarkFill) {
              ctx.fillStyle = '#ffffff';
            } else if (isStamped) {
              ctx.fillStyle = 'rgba(17, 17, 17, 0.45)';
            } else {
              ctx.fillStyle = '#111111';
            }
            ctx.fillText(String(dayNum), x + cw / 2, y + ch / 2 - 12);

            ctx.font = '700 20px "Inter", sans-serif';
            if (isDarkFill) {
              ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
            } else if (isStamped) {
              ctx.fillStyle = 'rgba(87, 83, 78, 0.5)';
            } else {
              ctx.fillStyle = '#57534e';
            }
            ctx.fillText(wkLabel, x + cw / 2, y + ch / 2 + 22);
            ctx.restore();
          }

          if (cellData && (cellData.mode === 'check' || cellData.mode === 'star')) {
            const isDark = cellData.color.toLowerCase() === '#111111';
            const markCol = isDark ? '#ffffff' : '#111111';
            if (cellData.mode === 'check') {
              ctx.save();
              ctx.strokeStyle = markCol;
              ctx.lineWidth = 8;
              ctx.lineCap = 'round';
              ctx.lineJoin = 'round';
              ctx.beginPath();
              ctx.moveTo(x + cw * 0.26, y + ch * 0.54);
              ctx.lineTo(x + cw * 0.44, y + ch * 0.72);
              ctx.lineTo(x + cw * 0.76, y + ch * 0.32);
              ctx.stroke();
              ctx.restore();
            } else if (cellData.mode === 'star') {
              drawStarCanvas(ctx, x + cw / 2, y + ch / 2, 5, cw * 0.28, cw * 0.12, markCol, markCol, 3);
            }
          }

          ctx.strokeStyle = '#111111';
          ctx.lineWidth = 5.5;
          ctx.strokeRect(x, y, cw, ch);
        }

        const link = document.createElement('a');
        const safeName = (state.habitName || 'habit-tracker')
          .toLowerCase()
          .replace(/[^a-z0-9ğüşıöç-]+/gi, '-')
          .replace(/^-|-$/g, '');
        const mm = String(state.month + 1).padStart(2, '0');
        link.download = `${safeName || 'habit-tracker'}-${state.year}-${mm}-damga.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
      }

      loadState();
      buildGrid();
      bindToolbar();
      updateProgress();
      initFirebaseSync();
      initAutomaticDateSync();

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch((err) => {
            console.warn('Service Worker kaydedilemedi:', err);
          });
        });
      }
    })();
  </script>
